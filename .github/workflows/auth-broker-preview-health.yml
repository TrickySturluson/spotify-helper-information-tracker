name: SHIT Auth Broker Preview Health

on:
  push:
    branches:
      - feature/oidc-broker-refresh-endpoint
    paths:
      - "auth-broker/**"
      - ".github/workflows/auth-broker-preview-health.yml"
      - ".github/workflows/deploy-mobile-auth-broker.yml"
      - "docs/WORKFLOWS.md"
      - "project/goals/mobile-cloud-operation/**"

permissions:
  checks: read

jobs:
  preview-health:
    name: Verify deployed auth broker preview
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wait for the Cloudflare build for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 36); do
            checks="$(curl --fail --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs")"
            state="$(jq -r '[.check_runs[] | select(.name == "Workers Builds: shit-auth-broker")] | sort_by(.started_at // "") | last | (.conclusion // .status // empty)' <<< "${checks}")"
            case "${state}" in
              success)
                echo "Cloudflare preview build succeeded for ${GITHUB_SHA}."
                break
                ;;
              failure|cancelled|timed_out|action_required)
                echo "::error::Cloudflare preview build ended with ${state} for ${GITHUB_SHA}."
                exit 1
                ;;
            esac
            if [ "${attempt}" -eq 36 ]; then
              echo "::error::Timed out waiting for the Cloudflare preview build for ${GITHUB_SHA}."
              exit 1
            fi
            sleep 5
          done

      - name: Probe the non-secret preview health endpoint
        env:
          PREVIEW_URL: https://feature-oidc-broker-refresh-endpoint-shit-auth-broker.trickysturluson.workers.dev
        run: |
          for attempt in $(seq 1 12); do
            status="$(curl --silent --show-error --max-time 10 \
              --output /tmp/broker-health.json \
              --write-out "%{http_code}" \
              "${PREVIEW_URL}/health" || true)"
            if [ "${status}" = "200" ] && jq -e '.status == "ok" and .service == "shit-auth-broker"' /tmp/broker-health.json >/dev/null 2>&1; then
              echo "Preview health check passed for ${GITHUB_SHA}."
              cat /tmp/broker-health.json
              exit 0
            fi
            sleep 5
          done
          echo "::error::Preview health endpoint did not return the expected non-secret readiness response."
          exit 1

      - name: Verify the preview stays OAuth-disabled by default
        env:
          PREVIEW_URL: https://feature-oidc-broker-refresh-endpoint-shit-auth-broker.trickysturluson.workers.dev
        run: |
          status="$(curl --silent --show-error --max-time 10 \
            --output /tmp/broker-disabled.json \
            --write-out "%{http_code}" \
            "${PREVIEW_URL}/" || true)"
          if [ "${status}" != "503" ] || ! jq -e '.error == "broker_not_activated"' /tmp/broker-disabled.json >/dev/null 2>&1; then
            echo "::error::The branch preview must remain OAuth-disabled unless explicitly activated by the guarded production workflow."
            echo "Observed preview root HTTP status: ${status}"
            echo "Non-secret preview root response (first 500 bytes):"
            head -c 500 /tmp/broker-disabled.json || true
            exit 1
          fi
          echo "Preview is live but OAuth remains disabled by default."

# FILE OVERVIEW
# Purpose: Independently probe the deployed Cloudflare auth-broker preview after its exact-commit build succeeds.
# Trigger: Pushes to the consolidated PR #188 OIDC integration branch when broker code or this smoke-test workflow changes.
# Credentials: Uses only the short-lived GitHub Actions GITHUB_TOKEN with checks:read; the HTTP health probe is unauthenticated and reveals no secrets.
# Side effects: Read-only GitHub check polling and GET /health plus GET / on the PR #188 branch preview. No OAuth, credential, Worker, playlist, or repository writes.
# Safety: Waits for the Cloudflare check on GITHUB_SHA before probing; confirms liveness and that the preview remains OAuth-disabled by default.
