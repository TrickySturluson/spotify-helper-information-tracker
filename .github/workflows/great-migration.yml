name: SHIT — Great Migration

on:
  schedule:
    - cron: '17 9 * * *'
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      command:
        description: SHIT Library operation
        required: true
        type: choice
        options:
          - status
          - preview
          - migrate
          - prepare
          - prepare-preview
          - audit
          - health
          - verify
          - backfill-playability
          - verify-catalogue
          - maintain-preview
          - freshness-review
          - validate-freshness-branch
          - duration-evidence-preview
          - duration-evidence-apply

permissions:
  contents: write
  issues: write

concurrency:
  group: shit-great-migration
  cancel-in-progress: false

jobs:
  library:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.user.login == github.repository_owner &&
       startsWith(github.event.issue.title, '[SHIT LIBRARY] '))
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Validate requested operation
        id: request
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_COMMAND: ${{ inputs.command }}
        run: |
          python - <<'PY'
          import json, os
          allowed = {"status", "preview", "migrate", "prepare", "prepare-preview", "audit", "health", "verify", "backfill-playability", "verify-catalogue", "maintain-preview", "freshness-review", "validate-freshness-branch", "duration-evidence-preview", "duration-evidence-apply"}
          if os.environ["EVENT_NAME"] == "workflow_dispatch":
              command = os.environ.get("DISPATCH_COMMAND", "").strip().lower()
          else:
              with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as handle:
                  event = json.load(handle)
              title = event["issue"]["title"].strip()
              prefix = "[SHIT LIBRARY] "
              if not title.startswith(prefix):
                  raise SystemExit("Not a SHIT Library request.")
              command = title[len(prefix):].strip().lower()
          if command not in allowed:
              raise SystemExit("Unsupported SHIT Library operation.")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write("command=" + command + "\n")
          print("Validated SHIT Library operation:", command)
          PY

      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Compile and run regression tests
        run: |
          set -o pipefail
          {
            echo "=== Compile Python modules ==="
            python -m compileall -q scripts compat shit.py
            echo "=== Full regression suite ==="
            python -m unittest discover -s tests -t . -v
          } 2>&1 | tee shit-library-run.log

      - name: Mint narrowly scoped GitHub App token for Spotify secret rotation
        if: steps.request.outputs.command == 'verify'
        id: spotify-secret-writer
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.SHIT_GITHUB_APP_CLIENT_ID }}
          private-key: ${{ secrets.SHIT_GITHUB_APP_PRIVATE_KEY }}
          permission-secrets: write

      - name: Verify provider credentials (read-only)
        if: steps.request.outputs.command == 'verify'
        env:
          SPOTIFY_CLIENT_ID: ${{ vars.SPOTIFY_CLIENT_ID }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          GH_TOKEN: ${{ steps.spotify-secret-writer.outputs.token }}
          SHIT_PERSIST_ROTATED_SPOTIFY_TOKEN: "1"
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          DISCOGS_USER_TOKEN: ${{ secrets.DISCOGS_USER_TOKEN }}
          GETSONGBPM_API_KEY: ${{ secrets.GETSONGBPM_API_KEY }}
        run: |
          set -o pipefail
          python scripts/music/verify_provider_credentials.py 2>&1 | tee shit-library-run.log

      - name: Run requested SHIT Library operation
        if: steps.request.outputs.command != 'verify'
        env:
          COMMAND: ${{ steps.request.outputs.command }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          DISCOGS_USER_TOKEN: ${{ secrets.DISCOGS_USER_TOKEN }}
          GETSONGBPM_API_KEY: ${{ secrets.GETSONGBPM_API_KEY }}
          SPOTIFY_CLIENT_ID: ${{ vars.SPOTIFY_CLIENT_ID }}
        run: |
          set -o pipefail
          case "$COMMAND" in
            status)  python shit.py library status ;;
            preview) python shit.py library preview ;;
            migrate) python shit.py library migrate --yes ;;
            prepare) python shit.py library prepare --execute --yes --skip-spotify-refresh ;;
            prepare-preview) python shit.py library prepare --skip-spotify-refresh ;;
            audit)   python shit.py library audit ;;
            health)  python shit.py library health --json ;;
            backfill-playability) python scripts/spotify/spotify_reference_library.py backfill-playability ;;
            maintain-preview) python shit.py library maintain --json ;;
            freshness-review) python shit.py library freshness --json --limit 25 --market from_token --include-unknown-age ;;
            duration-evidence-preview) python shit.py library duration-evidence --json ;;
            duration-evidence-apply) python shit.py library duration-evidence --apply --yes --json ;;
            validate-freshness-branch)
              git fetch origin feature/freshness-baseline-rotation-final
              git checkout FETCH_HEAD
              python -m compileall -q scripts compat shit.py
              python -m unittest discover -s tests -t . -v
              python shit.py library freshness --json --limit 25 --market from_token --include-unknown-age > freshness-branch-plan.json
              python -c 'import json; r=json.load(open("freshness-branch-plan.json", encoding="utf-8")); assert r.get("mode") == "read_only_plan", r; assert r.get("provider_requests") == 0, r; assert r.get("writes") == 0, r; assert r.get("selected_task_count", 0) <= 25, r; assert r.get("selected_due_count", 0) <= 25, r; assert r.get("selected_baseline_count", 0) <= 25, r; assert r.get("selected_task_count") == r.get("selected_due_count", 0) + r.get("selected_baseline_count", 0), r; assert not r.get("errors"), r.get("errors", [])[:10]; c=r.get("counts", {}); print("Freshness branch full-catalogue plan:", c.get("songs_scanned"), c.get("artists_scanned"), c.get("albums_scanned")); print("due/baseline candidates:", r.get("due_task_count"), r.get("baseline_candidate_count")); print("selected due/baseline:", r.get("selected_due_count"), r.get("selected_baseline_count")); print("no data/missing timestamp/missing provenance:", c.get("no_data"), c.get("missing_timestamp"), c.get("missing_provenance")); print("provider_requests=0 writes=0")'
              ;;
            verify-catalogue)
              python shit.py library audit
              python shit.py library health --json
              python shit.py library confidence --json
              ;;
          esac 2>&1 | tee shit-library-run.log
          {
            printf '%s\n' '## SHIT Library operation'
            printf '\n'
            printf '%s\n' "- Operation: $COMMAND"
            printf '%s\n' "- Result: completed"
            printf '\n'
            printf '%s\n' '~~~text'
            tail -n 160 shit-library-run.log
            printf '%s\n' '~~~'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish canonical Library and enrichment data
        if: steps.request.outputs.command == 'migrate' || steps.request.outputs.command == 'prepare' || steps.request.outputs.command == 'duration-evidence-apply' || steps.request.outputs.command == 'backfill-playability'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "${{ steps.request.outputs.command }}" = "backfill-playability" ] || [ "${{ steps.request.outputs.command }}" = "duration-evidence-apply" ]; then
            git add assistant_data/music/library/
          else
            git add assistant_data/music/
          fi
          if git diff --cached --quiet; then
            echo "No generated Library or metadata changes to commit."
          else
            git commit -m "Run SHIT Library operation: ${{ steps.request.outputs.command }}"
            published=false
            for attempt in 1 2 3 4 5; do
              echo "Safe publication attempt $attempt/5"
              git fetch origin main
              if ! git rebase origin/main; then
                echo "Rebase conflict detected; aborting without resolving or overwriting concurrent data."
                git rebase --abort || true
                exit 1
              fi
              if git push origin HEAD:main; then
                published=true
                echo "Published successfully on attempt $attempt."
                break
              fi
              echo "Push raced with another main update; refetching and retrying."
              if [ "$attempt" -lt 5 ]; then sleep 2; fi
            done
            if [ "$published" != "true" ]; then
              echo "Could not publish after five safe attempts; backup and artifact remain available."
              exit 1
            fi
          fi

      - name: Upload generated Library and rollback backup
        if: >-
          always() &&
          (steps.request.outputs.command == 'migrate' ||
           steps.request.outputs.command == 'prepare' ||
           steps.request.outputs.command == 'duration-evidence-apply' ||
           steps.request.outputs.command == 'backfill-playability')
        uses: actions/upload-artifact@v7.0.2
        with:
          name: shit-library-data-${{ github.run_id }}
          path: |
            assistant_data/music/
            shit-library-run.log
            freshness-branch-plan.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload read-only operation report
        if: >-
          always() &&
          !(steps.request.outputs.command == 'migrate' ||
            steps.request.outputs.command == 'prepare' ||
            steps.request.outputs.command == 'duration-evidence-apply' ||
            steps.request.outputs.command == 'backfill-playability')
        uses: actions/upload-artifact@v7.0.2
        with:
          name: shit-library-report-${{ github.run_id }}
          path: |
            shit-library-run.log
            freshness-branch-plan.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Report result on the requesting issue
        if: always() && github.event_name == 'issues'
        uses: actions/github-script@v8
        env:
          COMMAND: ${{ steps.request.outputs.command }}
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const fs = require('fs');
            let report = 'No run log was produced. Check the workflow logs.';
            if (fs.existsSync('shit-library-run.log')) {
              report = fs.readFileSync('shit-library-run.log', 'utf8').slice(-50000);
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                '## SHIT Library operation',
                '',
                '- Operation: ' + (process.env.COMMAND || 'validation failed'),
                '- Workflow result: ' + process.env.JOB_STATUS,
                '',
                '```text',
                report,
                '```',
                '',
                'The complete logs, generated music data, and pre-migration backup are attached to this workflow run.'
              ].join('\n')
            });


  daily-credential-check:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Verify provider credentials (read-only)
        id: verify
        continue-on-error: true
        env:
          SPOTIFY_CLIENT_ID: ${{ vars.SPOTIFY_CLIENT_ID }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          DISCOGS_USER_TOKEN: ${{ secrets.DISCOGS_USER_TOKEN }}
          GETSONGBPM_API_KEY: ${{ secrets.GETSONGBPM_API_KEY }}
        run: |
          set -o pipefail
          python scripts/music/verify_provider_credentials.py 2>&1 | tee credential-verification.log
      - name: Publish daily verification summary
        if: always()
        env:
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          {
            echo "## SHIT daily credential verification"
            echo
            echo "- Date: $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo "- Result: $VERIFY_OUTCOME"
            echo
            echo '\`\`\`text'
            if [ -f credential-verification.log ]; then cat credential-verification.log; else echo "Verifier did not produce a report."; fi
            echo ' \`\`\`'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Alert on failed verification
        if: steps.verify.outcome == 'failure'
        uses: actions/github-script@v8
        env:
          REPORT_FILE: credential-verification.log
        with:
          script: |
            const fs = require('fs');
            const report = fs.existsSync(process.env.REPORT_FILE)
              ? fs.readFileSync(process.env.REPORT_FILE, 'utf8').slice(-12000)
              : 'Verifier failed before producing a report. See the workflow run logs.';
            const title = '[SHIT ALERT] Daily credential verification failed';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            const existing = issues.find(issue => issue.title === title);
            const body = [
              'Automated daily provider credential verification failed.',
              '',
              'No credentials are included in this report. Review the sanitized results below and the linked Actions run.',
              '',
              'Workflow run: ' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId,
              '',
              '```text',
              report,
              '```'
            ].join('\n');
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number, body
              });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body });
            }

# FILE OVERVIEW
# Purpose: ChatGPT-triggerable and manually dispatchable SHIT Library operations.
# Trigger: Daily provider credential check at 09:17 UTC; owner-created issues titled [SHIT LIBRARY] <status|preview|migrate|prepare-preview|prepare|audit|verify>.
# Commands: status/preview/health/verify/prepare-preview/validate-freshness-branch/duration-evidence-preview are read-only; duration-evidence-apply is a backup-protected provenance migration; prepare runs migration
#           followed by bounded, checkpointed metadata enrichment and final audit.
#           backfill-playability reads saved Spotify snapshots only and publishes song evidence.
# Safety: owner validation, allow-listed operations, serialized runs, latest-main checkout, tests first,
#         rollback backup artifact, no Spotify playlist writes, generated-data-only commits.
# Related: shit.py; scripts/music/library_cli.py; scripts/music/prepare_music_library.py; freshness baseline PR validation.
