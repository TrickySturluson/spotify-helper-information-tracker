name: Playlist fit read-only preview

on:
  pull_request:
    paths:
      - "scripts/spotify/playlist_fit_model.py"
      - "scripts/spotify/playlist_fit_preview.py"
      - "assistant_data/spotify/playlist_roles.json"
      - "assistant_data/spotify/playlists/**"
      - "assistant_data/spotify/playlist_fit_heldout_candidates_20261102.json"
      - "assistant_data/spotify/playlist_fit_booze_candidates_20261102.json"
      - "assistant_data/spotify/playlists/4diIlnF8BlgoJrwUfejf49.json"
      - "tests/test_playlist_fit_model.py"
      - "tests/test_playlist_fit_preview.py"
      - "scripts/spotify/compare_playlist_fit_human_reference.py"
      - "tests/test_playlist_fit_human_reference_comparison.py"
      - "tests/test_playlist_fit_booze_candidates.py"
      - "assistant_data/spotify/playlist_human_fit_ratings.json"
      - ".github/workflows/playlist-fit-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run focused regression tests
        run: python -m unittest tests.test_playlist_fit_model tests.test_playlist_fit_preview tests.test_playlist_fit_human_reference_comparison tests.test_playlist_fit_booze_candidates -v
      - name: Build five-target held-out preview (read-only)
        run: |
          python scripts/spotify/playlist_fit_preview.py \
            --candidates assistant_data/spotify/playlist_fit_heldout_candidates_20261102.json \
            --output artifacts/playlist_fit_preview.json
      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: playlist-fit-heldout-preview
          path: artifacts/playlist_fit_preview.json
          if-no-files-found: error
          retention-days: 14
      - name: Compare frozen preview to human reference labels (diagnostic only)
        run: |
          python scripts/spotify/compare_playlist_fit_human_reference.py \
            --preview artifacts/playlist_fit_preview.json \
            --ratings assistant_data/spotify/playlist_human_fit_ratings.json \
            --output artifacts/playlist_fit_human_reference_comparison.json
      - name: Upload post-hoc comparison artifact
        uses: actions/upload-artifact@v4
        with:
          name: playlist-fit-human-reference-diagnostic
          path: artifacts/playlist_fit_human_reference_comparison.json
          if-no-files-found: error
          retention-days: 14
      - name: Build Booze or Boos! cross-reference fit audit (read-only)
        run: |
          python scripts/spotify/playlist_fit_preview.py \
            --candidates assistant_data/spotify/playlist_fit_booze_candidates_20261102.json \
            --output artifacts/playlist_fit_booze_cross_reference.json
      - name: Upload Booze cross-reference audit
        uses: actions/upload-artifact@v4
        with:
          name: booze-five-axis-cross-reference-audit
          path: artifacts/playlist_fit_booze_cross_reference.json
          if-no-files-found: error
          retention-days: 14

# FILE OVERVIEW
# Purpose: Run the real-data five-target playlist-fit preview without Spotify credentials or write access.
# Safety: Read-only repository inputs; no Spotify API calls, human-score imports, or playlist writes.
# Output: A 14-day GitHub Actions artifact containing the auditable held-out preview JSON.
