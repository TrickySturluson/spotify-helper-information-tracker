name: Babel AI continuation

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: babel-ai-continuation
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      enabled: ${{ steps.state.outputs.enabled }}
      target_ref: ${{ steps.state.outputs.target_ref }}
      branch_exists: ${{ steps.state.outputs.branch_exists }}
    steps:
      - name: Check out the current default branch
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Select the continuation branch and inspect stop state
        id: state
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads https://github.com/${GITHUB_REPOSITORY}.git refs/heads/babel/agent-progress >/dev/null 2>&1; then
            target_ref="babel/agent-progress"
            branch_exists="true"
          else
            target_ref="main"
            branch_exists="false"
          fi
          git fetch --no-tags origin "$target_ref"
          git checkout --detach "origin/$target_ref"
          if grep -Eq '^status:[[:space:]]*complete$' project/BABEL_AGENT_STATE.md; then
            enabled="false"
            echo "Babel is marked complete; scheduled continuation is stopping."
          else
            enabled="true"
          fi
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            enabled="false"
            echo "::notice::Babel AI continuation is installed but OPENAI_API_KEY is not configured; skipping this run."
          fi
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"
          echo "target_ref=$target_ref" >> "$GITHUB_OUTPUT"
          echo "branch_exists=$branch_exists" >> "$GITHUB_OUTPUT"

  agent:
    needs: preflight
    if: needs.preflight.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
    outputs:
      patch: ${{ steps.codex.outputs.final-message }}
    steps:
      - name: Check out the latest Babel continuation state
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.preflight.outputs.target_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Run the bounded Babel documentation agent
        id: codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .github/babel/CONTINUATION_PROMPT.md
          permission-profile: ":workspace"
          safety-strategy: drop-sudo
          effort: high

  validate:
    needs: [preflight, agent]
    if: needs.preflight.outputs.enabled == 'true' && needs.agent.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.validate.outputs.changed }}
    steps:
      - name: Check out the continuation base without write credentials
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.preflight.outputs.target_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Apply candidate patch, enforce allowlist, and run full tests
        id: validate
        env:
          BABEL_PATCH: ${{ needs.agent.outputs.patch }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path

          patch = os.environ.get("BABEL_PATCH", "")
          if patch.strip() == "NO_CHANGES":
              Path("/tmp/babel-no-changes").write_text("true", encoding="utf-8")
          elif not patch.strip():
              raise SystemExit("Codex returned an empty patch instead of NO_CHANGES.")
          elif len(patch.encode("utf-8")) > 700_000:
              raise SystemExit("Patch exceeds the 700 KB safe job-output limit; split the task into a smaller batch.")
          elif not patch.startswith("diff --git "):
              raise SystemExit("Codex output is not a raw unified git diff.")
          else:
              Path("/tmp/babel.patch").write_text(patch, encoding="utf-8")
          PY
          if [ -f /tmp/babel-no-changes ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "The agent produced no documentation changes."
            exit 0
          fi
          patch_file="/tmp/babel.patch"
          git apply --check "$patch_file"
          git apply "$patch_file"
          python - <<'PY'
          import subprocess
          import sys

          tracked = subprocess.check_output(
              ["git", "diff", "--name-only", "-z"], text=False
          ).decode().split("\0")
          untracked = subprocess.check_output(
              ["git", "ls-files", "--others", "--exclude-standard", "-z"], text=False
          ).decode().split("\0")
          changed = sorted({path for path in tracked + untracked if path})
          allowed = (
              lambda p: p == "AGENTS.md"
              or (p.startswith("docs/") and p.endswith(".md"))
              or (p.startswith("project/") and p.endswith(".md"))
              or p in {
                  "tests/test_documentation_contract.py",
                  "tests/test_script_layout.py",
              }
          )
          rejected = [path for path in changed if not allowed(path)]
          deleted = subprocess.check_output(
              ["git", "diff", "--diff-filter=D", "--name-only"], text=True
          ).splitlines()
          if rejected or deleted:
              print("Rejected out-of-scope paths:", rejected, file=sys.stderr)
              print("Rejected deletions:", deleted, file=sys.stderr)
              raise SystemExit(1)
          print("Validated documentation-only paths:", *changed, sep="\n- ")
          PY
          python -m unittest discover -s tests -t . -v
          echo "changed=true" >> "$GITHUB_OUTPUT"

  publish:
    needs: [preflight, agent, validate]
    if: needs.preflight.outputs.enabled == 'true' && needs.validate.result == 'success' && needs.validate.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out the current continuation base
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.preflight.outputs.target_ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Apply the validated patch and recheck paths before publishing
        env:
          BABEL_PATCH: ${{ needs.agent.outputs.patch }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          patch = os.environ.get("BABEL_PATCH", "")
          if not patch.startswith("diff --git ") or len(patch.encode("utf-8")) > 700_000:
              raise SystemExit("Missing or oversized validated patch.")
          Path("/tmp/babel.patch").write_text(patch, encoding="utf-8")
          PY
          git apply --check /tmp/babel.patch
          git apply /tmp/babel.patch
          python - <<'PY'
          import subprocess
          import sys

          tracked = subprocess.check_output(["git", "diff", "--name-only", "-z"], text=False).decode().split("\0")
          untracked = subprocess.check_output(["git", "ls-files", "--others", "--exclude-standard", "-z"], text=False).decode().split("\0")
          changed = sorted({path for path in tracked + untracked if path})
          allowed = lambda p: (
              p == "AGENTS.md"
              or (p.startswith("docs/") and p.endswith(".md"))
              or (p.startswith("project/") and p.endswith(".md"))
              or p in {"tests/test_documentation_contract.py", "tests/test_script_layout.py"}
          )
          rejected = [path for path in changed if not allowed(path)]
          deleted = subprocess.check_output(["git", "diff", "--diff-filter=D", "--name-only"], text=True).splitlines()
          if rejected or deleted:
              print("Rejected paths:", rejected, "deletions:", deleted, file=sys.stderr)
              raise SystemExit(1)
          print("Publishing allowlisted paths:", *changed, sep="\n- ")
          PY

      - name: Commit and push the validated continuation batch
        env:
          BRANCH_EXISTS: ${{ needs.preflight.outputs.branch_exists }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$BRANCH_EXISTS" != "true" ]; then
            git switch -c babel/agent-progress
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- AGENTS.md docs project tests/test_documentation_contract.py tests/test_script_layout.py
          if git diff --cached --quiet; then
            echo "No staged changes after validation."
            exit 0
          fi
          git commit -m "Babel agent: continue documentation audit"
          git push origin HEAD:refs/heads/babel/agent-progress

      - name: Create or update the review pull request
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          existing="$(gh pr list --head babel/agent-progress --base main --state open --json number --jq '.[0].number // empty')"
          if [ -z "$existing" ]; then
            gh pr create \
              --base main \
              --head babel/agent-progress \
              --title "Babel: autonomous documentation continuation" \
              --body "## Purpose
          This pull request contains bounded documentation and documentation-contract work produced by the repository's Babel AI continuation workflow.

          ## Safety
          - Documentation and narrowly scoped documentation tests only.
          - Candidate tests run in a separate read-only job with no OpenAI API key and no write-capable GitHub token.
          - The publisher only applies the already-validated patch, rechecks paths, and publishes to the dedicated branch.
          - No Spotify/provider calls, playlist mutations, generated-data writes, or runtime feature changes.
          - This PR is not auto-merged; human review is required.

          The branch is updated by later scheduled runs while Babel remains active."
          else
            echo "Updated existing Babel continuation PR #$existing."
          fi

# FILE OVERVIEW
# Purpose: Runs a bounded OpenAI Codex worker against SHIT Documentation & Continuity (Babel).
# Trigger: Every six hours and manual dispatch; stops when project/BABEL_AGENT_STATE.md says complete.
# Permissions: Read-only agent and validation jobs; separate publisher receives contents:write and pull-requests:write.
# Safety: No write-capable token or API key is present while candidate tests run. Publisher rechecks allowlisted paths and never executes candidate code.
# Side effects: May update only a dedicated Babel branch and its review PR; never merges or touches Spotify/provider state.
# Related: .github/babel/CONTINUATION_PROMPT.md, project/BABEL_AGENT_STATE.md, docs/BABEL_AGENT.md.
