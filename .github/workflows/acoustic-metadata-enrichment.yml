name: Acoustic Metadata Enrichment

on:
  push:
    paths:
      - ".github/workflows/acoustic-metadata-enrichment.yml"
      - "compat/enrich_acousticbrainz.py"
      - "compat/enrich_musicbrainz_recording_ids.py"
  workflow_dispatch:
    inputs:
      max_batches:
        description: "Maximum 25-track AcousticBrainz batches (100 = up to 2,500 tracks)"
        required: false
        default: "100"
  schedule:
    - cron: "23 7 * * *"

permissions:
  contents: write

concurrency:
  group: acoustic-metadata-enrichment
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Resolve missing recording IDs (strict exact matches)
        env:
          MUSICBRAINZ_ID_LOOKUPS_PER_RUN: "1000"
        run: python compat/enrich_musicbrainz_recording_ids.py
      - name: Fetch AcousticBrainz metadata
        env:
          ACOUSTICBRAINZ_MAX_BATCHES: ${{ github.event.inputs.max_batches || '100' }}
        run: python compat/enrich_acousticbrainz.py
      - name: Fetch GetSongBPM fallback metadata (optional)
        env:
          GETSONGBPM_API_KEY: ${{ secrets.GETSONGBPM_API_KEY }}
          GETSONGBPM_LOOKUPS_PER_RUN: "300"
        run: python compat/enrich_getsongbpm.py
      - name: Commit updated audio profiles
        run: |
          if git diff --quiet -- assistant_data/music/audio_profiles.json assistant_data/music/artists/ assistant_data/music/getsongbpm_lookup_state.json; then
            echo "No new AcousticBrainz profiles."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assistant_data/music/audio_profiles.json assistant_data/music/artists/ assistant_data/music/getsongbpm_lookup_state.json
          git commit -m "Update bulk acoustic metadata profiles"
          git push


# -----------------------------------------------------------------------------
# FILE OVERVIEW
# Purpose: Enrich the music catalogue with recording IDs and acoustic/audio metadata.
# Trigger: Daily at 07:23 UTC; manual dispatch with a max_batches input; or pushes
#          affecting this workflow and the AcousticBrainz/MusicBrainz compatibility launchers.
# Inputs: MUSICBRAINZ_ID_LOOKUPS_PER_RUN is fixed at 1,000; manual max_batches
#         controls AcousticBrainz batches (default 100, up to 2,500 tracks).
# Providers: MusicBrainz recording-ID lookup, AcousticBrainz, and optional
#            GetSongBPM when GETSONGBPM_API_KEY is configured.
# Writes: Commits audio_profiles.json, artist-sharded audio data and
#         getsongbpm_lookup_state.json when those outputs change.
# Safety: Bounded provider calls; no Spotify playlist operations. contents:write.
# Related: scripts/music/enrich_acousticbrainz.py, enrich_musicbrainz_recording_ids.py,
#          enrich_getsongbpm.py; docs/AUTOMATED_AUDIO_METADATA.md and docs/WORKFLOWS.md.
# -----------------------------------------------------------------------------
