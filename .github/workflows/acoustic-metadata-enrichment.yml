name: Acoustic Metadata Enrichment

on:
  workflow_dispatch:
    inputs:
      max_batches:
        description: "Maximum 25-track AcousticBrainz batches (100 = up to 2,500 tracks)"
        required: false
        default: "100"
  schedule:
    - cron: "23 7 * * 1"

permissions:
  contents: write

concurrency:
  group: acoustic-metadata-enrichment
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch AcousticBrainz metadata
        env:
          ACOUSTICBRAINZ_MAX_BATCHES: ${{ github.event.inputs.max_batches || '100' }}
        run: python enrich_acousticbrainz.py
      - name: Commit updated audio profiles
        run: |
          if git diff --quiet -- assistant_data/music/audio_profiles.json; then
            echo "No new AcousticBrainz profiles."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assistant_data/music/audio_profiles.json
          git commit -m "Update bulk acoustic metadata profiles"
          git push
