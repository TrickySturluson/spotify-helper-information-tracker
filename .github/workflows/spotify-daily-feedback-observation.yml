name: SHIT — Daily Feedback Observation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/spotify-daily-feedback-observation.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * *"

permissions:
  contents: write
  id-token: write

concurrency:
  group: spotify-daily-feedback-observation
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile and test
        run: |
          python -m py_compile compat/spotify_playlist_manager.py compat/spotify_daily_feedback.py
          python -m unittest discover -s tests -t . -v
      - name: Obtain central Spotify access token
        env:
          SHIT_AUTH_BROKER_URL: ${{ vars.BROKER_BASE_URL }}
        run: python scripts/spotify/broker_access_token.py

      - name: Observe Daily outcomes
        env:
          SPOTIFY_CLIENT_ID: ${{ vars.SPOTIFY_CLIENT_ID }}
        run: python compat/spotify_daily_feedback.py observe
      - name: Audit refreshed project data
        run: python compat/audit_project.py
      - name: Persist feedback observations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assistant_data/spotify/daily_feedback.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh Tricky Daily feedback observations"
            git push
          fi


# -----------------------------------------------------------------------------
# FILE OVERVIEW
# Purpose: Observe Tricky Daily post-publication outcomes without rotating the playlist.
# Trigger: Daily at 08:17 UTC, manual workflow_dispatch, or a reviewed main-branch edit to this workflow file for an immediate post-cycle observation.
# Behavior: Runs tests, authenticates to Spotify, executes
#           compat/spotify_daily_feedback.py observe, audits generated data, and
#           commits assistant_data/spotify/daily_feedback.json when it changes.
# Credentials: Short-lived Spotify access tokens issued by the central OIDC broker.
# Safety: Observation/read operations only; does not add, remove or reorder tracks.
# API: Saved-item lookups percent-encode URIs and batch at the documented 40-URI maximum.
#         Repository feedback state is written with contents:write.
# Related: scripts/spotify/spotify_daily_feedback.py, docs/TRICKY_DAILY_CYCLE.md,
#          docs/WORKFLOWS.md.
# -----------------------------------------------------------------------------
