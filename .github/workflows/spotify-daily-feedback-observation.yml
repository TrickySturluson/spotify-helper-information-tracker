name: SHIT — Daily Feedback Observation

on:
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * *"

permissions:
  contents: write

concurrency:
  group: spotify-daily-feedback-observation
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile and test
        run: |
          python -m py_compile compat/spotify_playlist_manager.py compat/spotify_daily_feedback.py
          python -m unittest discover -s tests -v
      - name: Validate Spotify credentials
        env:
          SPOTIFY_CLIENT_ID: ${{ vars.SPOTIFY_CLIENT_ID }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: |
          test -n "$SPOTIFY_CLIENT_ID" || { echo "Missing repository variable SPOTIFY_CLIENT_ID" >&2; exit 1; }
          test -n "$SPOTIFY_REFRESH_TOKEN" || { echo "Missing repository secret SPOTIFY_REFRESH_TOKEN" >&2; exit 1; }
      - name: Observe Daily outcomes
        env:
          SPOTIFY_CLIENT_ID: ${{ vars.SPOTIFY_CLIENT_ID }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import spotify_playlist_manager as manager
          manager.TOKEN = Path(".spotify_playlist_token.json")
          manager.write(manager.TOKEN, {
              "refresh_token": os.environ["SPOTIFY_REFRESH_TOKEN"],
              "obtained_at": 0,
              "expires_in": 0,
          })
          PY
          python compat/spotify_daily_feedback.py observe
      - name: Audit refreshed project data
        run: python compat/audit_project.py
      - name: Persist feedback observations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assistant_data/spotify/daily_feedback.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh Tricky Daily feedback observations"
            git push
          fi
