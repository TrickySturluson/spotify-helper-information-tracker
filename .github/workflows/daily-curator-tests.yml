name: Daily curator tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/tricky-daily-curator]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile every Python module
        run: |
          python - <<'PY'
          from pathlib import Path
          import py_compile
          excluded = {".git", ".venv", "venv", "__pycache__"}
          files = [p for p in Path(".").rglob("*.py") if not any(part in excluded for part in p.parts)]
          for path in files:
              py_compile.compile(str(path), doraise=True)
          print(f"Compiled {len(files)} Python modules.")
          PY
      - name: Audit generated project data
        run: python compat/audit_project.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -t . -v
