name: Daily curator tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/tricky-daily-curator]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile curator and playlist manager
        run: python -m py_compile spotify_daily_playlist.py spotify_playlist_manager.py spotify_playlist_cloud.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
