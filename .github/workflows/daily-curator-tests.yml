name: Daily curator tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/tricky-daily-curator]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Compile every Python module
        run: |
          python - <<'PY'
          from pathlib import Path
          import py_compile
          excluded = {".git", ".venv", "venv", "__pycache__"}
          files = [p for p in Path(".").rglob("*.py") if not any(part in excluded for part in p.parts)]
          for path in files:
              py_compile.compile(str(path), doraise=True)
          print(f"Compiled {len(files)} Python modules.")
          PY
      - name: Audit generated project data
        run: python compat/audit_project.py
      - name: Health-check the full canonical Library (read-only)
        run: python shit.py library health --json
      - name: Confidence-audit the full canonical Library (read-only)
        run: python shit.py library confidence --json
      - name: Plan a bounded freshness sample against the full Library (read-only)
        run: |
          python scripts/music/metadata_freshness.py --json --limit 25 --include-unknown-age > /tmp/metadata-freshness-plan.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("/tmp/metadata-freshness-plan.json").read_text(encoding="utf-8"))
          assert report["mode"] == "read_only_plan"
          assert report["provider_requests"] == 0
          assert report["writes"] == 0
          assert report["selected_task_count"] <= 25
          assert report["selected_baseline_count"] <= 25
          assert report["selected_due_count"] <= 25
          assert not report["errors"], report["errors"][:5]
          counts = report["counts"]
          print("Freshness planner scanned", counts["songs_scanned"], "songs,",
                counts["artists_scanned"], "artists, and", counts["albums_scanned"], "albums;",
                "profile caches:", counts["track_profile_cache_rows"], "track,",
                counts["artist_profile_cache_rows"], "artist,", counts["album_profile_cache_rows"], "album;",
                "due tasks and", report["baseline_candidate_count"], "unknown-age baseline candidates;",
                "selected", report["selected_due_count"], "due and", report["selected_baseline_count"], "baseline tasks.")
          print("Missing timestamps:", counts["missing_timestamp"],
                "no data:", counts["no_data"], "missing provenance:", counts["missing_provenance"])
          PY
      - name: Check maintained file documentation
        run: python -m unittest tests.test_script_layout -v
      - name: Run unit tests
        run: python -m unittest discover -s tests -t . -v


# -----------------------------------------------------------------------------
# FILE OVERVIEW
# Purpose: Main CI gate for SHIT's maintained code, generated data and documentation.
# Trigger: Pull requests targeting main; pushes to main or feature/tricky-daily-curator.
# Behavior: Compiles maintained modules, audits generated project data, runs read-only
#           Library health/confidence/freshness checks, documentation/layout checks,
#           and full unittest discovery.
# Permissions: contents:read; no provider credentials or Spotify authentication.
# Safety: Validation only. No provider requests, repository writes or playlist mutations.
# Related: tests/README.md, tests/test_documentation_contract.py,
#          tests/test_script_layout.py, docs/WORKFLOWS.md.
# -----------------------------------------------------------------------------
