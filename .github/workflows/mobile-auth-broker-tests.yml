name: SHIT Mobile Auth Broker Tests

on:
  pull_request:
    paths:
      - "auth-broker/**"
      - "scripts/spotify/broker_access_token.py"
      - "scripts/spotify/spotify_playlist_manager.py"
      - "tests/test_spotify_broker_access.py"
      - "tests/test_spotify_auth_health_workflow.py"
      - "auth-broker/test/workflow-inventory.test.js"
      - ".github/workflows/spotify-auth-health-check.yml"
      - "tests/test_spotify_playlist_manager.py"
      - ".github/workflows/mobile-auth-broker-tests.yml"
      - ".github/workflows/deploy-mobile-auth-broker.yml"
      - "docs/WORKFLOWS.md"
      - "docs/README.md"
      - "docs/SPOTIFY_API_OPERATIONS.md"
      - "project/ROADMAP.md"
      - "project/goals/README.md"
      - "project/goals/mobile-cloud-operation/**"
  push:
    branches:
      - "feature/**"
    paths:
      - "auth-broker/**"
      - ".github/workflows/mobile-auth-broker-tests.yml"
      - ".github/workflows/deploy-mobile-auth-broker.yml"
      - "docs/WORKFLOWS.md"
      - "docs/README.md"
      - "docs/SPOTIFY_API_OPERATIONS.md"
      - "project/ROADMAP.md"
      - "project/goals/README.md"
      - "project/goals/mobile-cloud-operation/**"
  workflow_dispatch:

concurrency:
  group: mobile-auth-broker-tests-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: auth-broker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install pinned broker dependencies and refresh lockfile
        run: |
          npm install --global npm@10.9.4
          npm --version
          rm -f package-lock.json
          npm install --ignore-scripts --no-audit --no-fund --legacy-peer-deps
      - name: Preserve generated dependency lockfile for review
        uses: actions/upload-artifact@v7.0.2
        with:
          name: mobile-auth-broker-package-lock-${{ github.run_id }}
          path: auth-broker/package-lock.json
          retention-days: 7
          if-no-files-found: error
      - name: Audit complete broker dependency tree
        run: npm audit --audit-level=high
      - name: Run broker security unit tests
        run: npm test
      - name: Run Cloudflare SQLite Durable Object integration tests
        run: npm run test:durable-objects
      - name: Test broker access-token client and manager mode
        working-directory: .
        run: python -m unittest tests.test_spotify_broker_access tests.test_spotify_playlist_manager tests.test_spotify_auth_health_workflow -v
      - name: Check maintained Python script documentation
        working-directory: .
        run: python -m unittest tests.test_script_layout -v
      - name: Validate Worker bundle and Wrangler configuration without deploying
        run: |
          npx wrangler deploy --dry-run \
            --var "BROKER_BASE_URL:https://broker.example.workers.dev" \
            --var "GITHUB_APP_CLIENT_ID:example-client-id" \
            --var "GITHUB_APP_ID:123456" \
            --var "GITHUB_APP_REDIRECT_URI:https://broker.example.workers.dev/auth/github/callback" \
            --var "SPOTIFY_CLIENT_ID:example-spotify-client-id" \
            --var "SPOTIFY_REDIRECT_URI:https://broker.example.workers.dev/spotify/callback" \\
            --var "SPOTIFY_CREDENTIAL_ACTIVE_KEY_VERSION:1" \\
            --var "SPOTIFY_REFRESH_WORKFLOW_REFS:TrickySturluson/spotify-helper-information-tracker/.github/workflows/spotify-auth-health-check.yml@refs/heads/main,TrickySturluson/spotify-helper-information-tracker/.github/workflows/spotify-daily-live-preflight.yml@refs/heads/main,TrickySturluson/spotify-helper-information-tracker/.github/workflows/spotify-daily-midnight-cycle.yml@refs/heads/main,TrickySturluson/spotify-helper-information-tracker/.github/workflows/spotify-daily-feedback-observation.yml@refs/heads/main,TrickySturluson/spotify-helper-information-tracker/.github/workflows/tricky-daily-snapshot-refresh.yml@refs/heads/main,TrickySturluson/spotify-helper-information-tracker/.github/workflows/spotify-reference-library.yml@refs/heads/main,TrickySturluson/spotify-helper-information-tracker/.github/workflows/spotify-playlist-manager.yml@refs/heads/main,TrickySturluson/spotify-helper-information-tracker/.github/workflows/great-migration.yml@refs/heads/main,TrickySturluson/spotify-helper-information-tracker/.github/workflows/update.yml@refs/heads/main"

  commit-lockfile:
    needs: test
    if: github.event_name == 'push' && github.actor == 'TrickySturluson' && (github.ref == 'refs/heads/feature/mobile-spotify-reauth-reconciled' || github.ref == 'refs/heads/feature/oidc-broker-refresh-endpoint')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8.0.2
        with:
          name: mobile-auth-broker-package-lock-${{ github.run_id }}
          path: auth-broker
      - name: Commit only the generated broker lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add auth-broker/package-lock.json
          if git diff --cached --quiet; then
            echo "Broker lockfile is already current."
          else
            git commit -m "Lock audited mobile auth broker dependencies"
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

# FILE OVERVIEW
# Purpose: Run Node broker tests, Python access-token client tests, and real Workers SQLite Durable Object integration tests.
# Trigger: Pushes to feature/** and pull requests touching broker source/deployment files; manual workflow_dispatch.
# Credentials: Test job uses none; the owner-only lockfile commit job uses the scoped default GITHUB_TOKEN with contents: write.
# Side effects: Installs audited dependencies, runs local tests/dry-run, and on an owner push to this feature branch commits only the generated package-lock.json.
# Safety: No Spotify, Cloudflare, repository Secrets, or playlist permissions; write permission is isolated to the lockfile-only job.
