name: SHIT Mobile Auth Broker Tests

on:
  pull_request:
    paths:
      - "auth-broker/**"
      - ".github/workflows/mobile-auth-broker-tests.yml"
  push:
    branches:
      - "feature/**"
    paths:
      - "auth-broker/**"
      - ".github/workflows/mobile-auth-broker-tests.yml"
  workflow_dispatch:

concurrency:
  group: mobile-auth-broker-tests-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: auth-broker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install pinned broker dependencies
        run: npm install --ignore-scripts
      - name: Run broker security unit tests
        run: npm test
      - name: Validate Worker bundle and Wrangler configuration without deploying
        run: |
          npx wrangler deploy --dry-run \
            --var "BROKER_BASE_URL:https://broker.example.workers.dev" \
            --var "GITHUB_APP_CLIENT_ID:example-client-id" \
            --var "GITHUB_APP_ID:123456" \
            --var "GITHUB_APP_REDIRECT_URI:https://broker.example.workers.dev/auth/github/callback" \
            --var "SPOTIFY_CLIENT_ID:example-spotify-client-id" \
            --var "SPOTIFY_REDIRECT_URI:https://broker.example.workers.dev/spotify/callback"

# FILE OVERVIEW
# Purpose: Run isolated Node tests for the mobile Spotify OAuth broker.
# Trigger: Pushes to feature/** and pull requests touching auth-broker files; manual workflow_dispatch.
# Credentials: None. This workflow never contacts Spotify, GitHub Secrets, or Cloudflare.
# Side effects: Installs pinned dependencies on an ephemeral runner and runs local tests only.
# Safety: No secrets or playlist permissions are available to this job.
