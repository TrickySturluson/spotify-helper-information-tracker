name: Update Last.fm History

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update Last.fm history
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
        run: python update_lastfm.py

      - name: Build existing statistics
        run: python build_stats.py

      - name: Build assistant-friendly analytics
        run: python build_assistant_data.py

      - name: Build advanced listening analytics
        run: python build_advanced_analytics.py

      - name: Validate generated data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("assistant_data/manifest.json").read_text(encoding="utf-8"))
          metadata = json.loads(Path("data/metadata.json").read_text(encoding="utf-8"))
          stats = json.loads(Path("data/stats.json").read_text(encoding="utf-8"))
          expected = int(metadata["total_scrobbles"])
          assert manifest["source_scrobbles"] == expected, (manifest["source_scrobbles"], expected)
          assert stats["overview"]["total_scrobbles"] == expected
          assert manifest["validation"]["year_total"] == expected
          assert manifest["validation"]["month_total"] == expected
          assert manifest["validation"]["day_total"] == expected
          print(f"Validated {expected:,} scrobbles across assistant datasets.")
          PY

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/ assistant_data/

          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Update Last.fm history and assistant analytics"
            git push
          fi
