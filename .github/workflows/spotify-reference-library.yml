name: SHIT — Spotify Reference Library

on:
  workflow_dispatch:
  schedule:
    - cron: "41 7 * * 0"

permissions:
  contents: write

concurrency:
  group: spotify-reference-library
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile and test
        run: |
          python -m py_compile spotify_playlist_manager.py spotify_reference_library.py spotify_daily_feedback.py
          python -m unittest discover -s tests -v
      - name: Refresh Spotify reference library
        env:
          SPOTIFY_CLIENT_ID: ${{ vars.SPOTIFY_CLIENT_ID }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import spotify_playlist_manager as manager
          manager.TOKEN = Path(".spotify_playlist_token.json")
          manager.write(manager.TOKEN, {
              "refresh_token": os.environ["SPOTIFY_REFRESH_TOKEN"],
              "obtained_at": 0,
              "expires_in": 0,
          })
          PY
          python spotify_reference_library.py sync
      - name: Commit reference snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assistant_data/spotify/
          if ! git diff --cached --quiet; then
            git commit -m "Refresh Spotify reference library"
            git push
          fi
