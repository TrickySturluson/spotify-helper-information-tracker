name: SHIT — Spotify Reference Library

on:
  # A commit to this workflow file is also the safe, auditable manual-sync
  # trigger when the connected GitHub integration cannot dispatch workflows.
  push:
    branches: [main]
    paths:
      - ".github/workflows/spotify-reference-library.yml"
  workflow_dispatch:
  schedule:
    - cron: "13 6 * * *"

permissions:
  contents: write

concurrency:
  group: spotify-reference-library
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile and test
        run: |
          python -m py_compile compat/spotify_playlist_manager.py compat/spotify_reference_library.py compat/spotify_daily_feedback.py
          python -m unittest discover -s tests -t . -v
      - name: Verify Spotify credentials are configured
        env:
          SPOTIFY_CLIENT_ID: ${{ vars.SPOTIFY_CLIENT_ID }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          GH_TOKEN: ${{ steps.spotify-secret-writer.outputs.token }}
        run: |
          test -n "$SPOTIFY_CLIENT_ID" || (echo "Missing repository variable SPOTIFY_CLIENT_ID"; exit 1)
          test -n "$SPOTIFY_REFRESH_TOKEN" || (echo "Missing repository secret SPOTIFY_REFRESH_TOKEN"; exit 1)
      - name: Mint narrowly scoped GitHub App token for Spotify secret rotation
        id: spotify-secret-writer
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.SHIT_GITHUB_APP_CLIENT_ID }}
          private-key: ${{ secrets.SHIT_GITHUB_APP_PRIVATE_KEY }}
          permission-secrets: write

      - name: Seed removal baseline from the previous complete snapshots
        run: python compat/track_playlist_removals.py --seed-from-reference-library
      - name: Refresh Spotify reference library
        env:
          SPOTIFY_CLIENT_ID: ${{ vars.SPOTIFY_CLIENT_ID }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          GH_TOKEN: ${{ steps.spotify-secret-writer.outputs.token }}
        run: |
          python - <<'PY'
          import os
          import sys
          from pathlib import Path
          sys.path.insert(0, "compat")
          import spotify_playlist_manager as manager
          manager.TOKEN = Path(".spotify_playlist_token.json")
          manager.write(manager.TOKEN, {
              "refresh_token": os.environ["SPOTIFY_REFRESH_TOKEN"],
              "obtained_at": 0,
              "expires_in": 0,
          })
          PY
          python compat/spotify_reference_library.py sync
      - name: Verify priority and sorter audition playlist snapshots are complete and current
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          targets = {
              "4diIlnF8BlgoJrwUfejf49": "Booze or Boos!",
              "4aLdllLgRPh5vKOznkC97D": "SHITting Grounds",
          }
          for playlist_id, name in targets.items():
              path = Path(f"assistant_data/spotify/playlists/{playlist_id}.json")
              if not path.is_file():
                  raise SystemExit(f"{name} snapshot is missing; refusing to publish.")
              data = json.loads(path.read_text(encoding="utf-8"))
              if not data.get("items_accessible"):
                  raise SystemExit(f"{name} items were inaccessible; refusing to publish a stale snapshot.")
              reported = data.get("total_items_reported")
              fetched = data.get("item_count_fetched")
              if not isinstance(reported, int) or reported != fetched:
                  raise SystemExit(f"{name} snapshot is incomplete: Spotify reports {reported}, fetched {fetched}.")
              if len(data.get("items", [])) != fetched:
                  raise SystemExit(f"{name} item list length does not match fetched count.")
              print(f"Verified {name}: {fetched} items; Spotify snapshot {data.get('snapshot_id')}; captured {data.get('captured_at')}.")
          PY
      - name: Compare removals against the freshly refreshed snapshots
        run: python compat/track_playlist_removals.py --from-reference-library
      - name: Audit refreshed project data
        run: python compat/audit_project.py
      - name: Commit reference snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assistant_data/spotify/ assistant_data/music/library/
          if [ -f playlist_removal_baseline.json ]; then git add playlist_removal_baseline.json; fi
          if [ -f playlist_removed_tracks.json ]; then git add playlist_removed_tracks.json; fi
          if ! git diff --cached --quiet; then
            git commit -m "Refresh Spotify reference library and removal feedback"
            published=false
            for attempt in 1 2 3 4 5; do
              echo "Safe reference-library publication attempt $attempt/5"
              git fetch origin main
              if ! git rebase origin/main; then
                echo "Rebase conflict; refusing to overwrite concurrent project changes."
                git rebase --abort || true
                exit 1
              fi
              if git push origin HEAD:main; then
                published=true
                echo "Reference library and removal baseline published."
                break
              fi
              echo "Push raced with another main update; retrying after fetch/rebase."
              if [ "$attempt" -lt 5 ]; then sleep 2; fi
            done
            if [ "$published" != "true" ]; then
              echo "Could not safely publish reference snapshots after five attempts."
              exit 1
            fi
          fi


