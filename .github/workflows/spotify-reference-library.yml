name: SHIT — Spotify Reference Library

on:
  workflow_dispatch:
  schedule:
    - cron: "13 */6 * * *"

permissions:
  contents: write

concurrency:
  group: spotify-reference-library
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile and test
        run: |
          python -m py_compile compat/spotify_playlist_manager.py compat/spotify_reference_library.py compat/spotify_daily_feedback.py
          python -m unittest discover -s tests -t . -v
      - name: Refresh Spotify reference library
        env:
          SPOTIFY_CLIENT_ID: ${{ vars.SPOTIFY_CLIENT_ID }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import spotify_playlist_manager as manager
          manager.TOKEN = Path(".spotify_playlist_token.json")
          manager.write(manager.TOKEN, {
              "refresh_token": os.environ["SPOTIFY_REFRESH_TOKEN"],
              "obtained_at": 0,
              "expires_in": 0,
          })
          PY
          python compat/spotify_reference_library.py sync
      - name: Verify priority playlist snapshot is complete and current
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("assistant_data/spotify/playlists/4diIlnF8BlgoJrwUfejf49.json")
          if not path.is_file():
              raise SystemExit("Booze or Boos! snapshot is missing; refusing to publish.")
          data = json.loads(path.read_text(encoding="utf-8"))
          if not data.get("items_accessible"):
              raise SystemExit("Booze or Boos! items were inaccessible; refusing to publish a stale snapshot.")
          reported = data.get("total_items_reported")
          fetched = data.get("item_count_fetched")
          if not isinstance(reported, int) or reported != fetched:
              raise SystemExit(f"Booze or Boos! snapshot is incomplete: Spotify reports {reported}, fetched {fetched}.")
          if len(data.get("items", [])) != fetched:
              raise SystemExit("Booze or Boos! item list length does not match fetched count.")
          print(f"Verified Booze or Boos!: {fetched} items; Spotify snapshot {data.get('snapshot_id')}; captured {data.get('captured_at')}.")
          PY
      - name: Audit refreshed project data
        run: python compat/audit_project.py
      - name: Commit reference snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assistant_data/spotify/
          if ! git diff --cached --quiet; then
            git commit -m "Refresh Spotify reference library"
            git push
          fi


