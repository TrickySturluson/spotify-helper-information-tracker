name: SHIT — Tricky Daily Midnight Cycle

on:
  push:
    branches: [main]
    paths:
      - ".github/test-triggers/tricky-daily-live-cycle.json"
  workflow_dispatch:
    inputs:
      force:
        description: "Run immediately instead of waiting for midnight Eastern"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
  schedule:
    # Primary EST/EDT midnight entries, plus a 15-minute recovery delivery.
    # Script gate skips 23:xx EST pre-midnight entries; date guard makes
    # duplicate deliveries cheap no-ops after the first accepted rotation.
    - cron: "0 4,5 * * *"
    - cron: "15 4,5 * * *"

permissions:
  contents: write
  id-token: write

concurrency:
  group: tricky-daily-midnight-cycle
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile and test
        run: |
          python -m py_compile compat/spotify_daily_cycle.py compat/spotify_playlist_manager.py compat/spotify_discovery.py compat/spotify_daily_feedback.py compat/spotify_listening_trends.py
          python -m unittest discover -s tests -t . -v
      - name: Validate non-Spotify credentials
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
        run: test -n "$LASTFM_API_KEY" || { echo "Missing LASTFM_API_KEY" >&2; exit 1; }
      - name: Obtain central Spotify access token
        env:
          SHIT_AUTH_BROKER_URL: ${{ vars.BROKER_BASE_URL }}
        run: python scripts/spotify/broker_access_token.py
      - name: Cycle Tricky Daily
        id: daily-cycle
        env:
          SPOTIFY_CLIENT_ID: ${{ vars.SPOTIFY_CLIENT_ID }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          FORCE_CYCLE: ${{ github.event_name == 'push' && 'true' || inputs.force }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            # A committed trigger file can request a real forced track cycle.
            # The default action remains description-only for backward safety.
            ACTION=$(python -c 'import json; print(json.load(open(".github/test-triggers/tricky-daily-live-cycle.json")).get("action", "description-only"))')
            if [ "$ACTION" = "cycle" ]; then
              python compat/spotify_daily_cycle.py --force
            elif [ "$ACTION" = "description-only" ]; then
              python compat/spotify_daily_cycle.py --force --description-only
            elif [ "$ACTION" = "verify-only" ]; then
              python compat/spotify_daily_cycle.py --force --verify-only
            elif [ "$ACTION" = "stage-only" ]; then
              # Generate and durably commit a test-only stage; never call Spotify write endpoints.
              python compat/spotify_daily_cycle.py --force --stage-only
            else
              echo "Unsupported Tricky Daily trigger action: $ACTION" >&2
              exit 1
            fi
          elif [ "$FORCE_CYCLE" = "true" ]; then
            python compat/spotify_daily_cycle.py --force
          else
            python compat/spotify_daily_cycle.py
          fi
      - name: Preserve recovery snapshots
        if: always() && hashFiles('playlist_backups/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: tricky-daily-backup-${{ github.run_id }}
          path: playlist_backups/
          retention-days: 30
          if-no-files-found: ignore
      - name: Persist cycle state and feedback
        # Persist accepted track replacements or description updates even if
        # their subsequent read-back fails, so a retry cannot blindly repeat writes.
        if: always() && (steps.daily-cycle.outputs.cycled == 'true' || steps.daily-cycle.outputs.description_updated == 'true')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          test -f .github/spotify_playlist_manager_state.json || { echo "Missing required playlist manager state" >&2; exit 1; }
          test -f .github/spotify_playlist_manager_audit.jsonl || { echo "Missing required playlist manager audit" >&2; exit 1; }
          git add -- .github/spotify_playlist_manager_state.json .github/spotify_playlist_manager_audit.jsonl
          for path in assistant_data/spotify/daily_feedback.json assistant_data/spotify/listening_trends.json playlist_removal_baseline.json playlist_removed_tracks.json assistant_data/recommendations/discovery_candidates.json; do
            if [ -f "$path" ]; then
              git add -- "$path"
            else
              echo "Optional cycle output not present; skipping: $path"
            fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "Cycle Tricky Daily playlist state"
            git push
          fi
      - name: Preserve surfaced candidates and Spotify cooldown even if rotation fails
        if: always() && (hashFiles('assistant_data/recommendations/discovery_candidates.json') != '' || hashFiles('.github/spotify_api_cooldown.json') != '')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for path in assistant_data/recommendations/discovery_candidates.json .github/spotify_api_cooldown.json; do
            if [ -f "$path" ]; then
              git add -- "$path"
            fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "Preserve Tricky Daily candidates and Spotify cooldown"
            git push
          fi


# -----------------------------------------------------------------------------
# FILE OVERVIEW
# Purpose: Automatically rotate Tricky Daily at midnight America/New_York.
# Schedule: Dual EST/EDT cron entries with a 15-minute recovery delivery;
#           the script gate and per-date guard make delayed/duplicate runs safe.
# Safety: Requires credentials, exact playlist ownership, managed-playlist permission,
#         explicit unlock, exactly 60 valid unique track URIs, and a pre-change backup.
# Force bypasses only the clock-window gate; the same-Eastern-date completion
# guard remains active for scheduled, manual, and forced invocations.
# Recovery: Accepted replacements publish cycled=true and persist the daily idempotency
#           state even if post-change verification later fails.
# -----------------------------------------------------------------------------
