name: Public repository security scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Scan complete Git history for secrets
    runs-on: ubuntu-latest
    steps:
      - name: Check out full repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks version
      - name: Scan all commits (redacted output)
        run: /tmp/gitleaks git --log-opts=--all --redact --verbose --exit-code 1 .

# -----------------------------------------------------------------------------
# FILE OVERVIEW
# Purpose: Scan the complete Git history for credential-like secrets.
# Trigger: Runs on main pushes, pull requests, weekly, and manual dispatch.
# Behavior: Checks out all history and runs Gitleaks with redacted findings so
#           suspected secret values are not printed in workflow logs.
# Permissions: contents: read; no repository write token or external secrets.
# Maintenance: Keep the scanner version pinned and review findings before
#              suppressing any rule or changing the scan scope.
# Related: docs/PUBLIC_REPOSITORY_PRIVACY.md and .gitignore.
# -----------------------------------------------------------------------------
