name: Spotify playlist manager checks

on:
  push:
    branches: [spotify-playlist-manager]
    paths:
      - "compat/spotify_playlist_manager.py"
      - "compat/spotify_playlist_cloud.py"
      - "README.md"
      - ".github/workflows/spotify-playlist-manager.yml"
      - "tests/test_compat/spotify_playlist_manager.py"
      - "tests/test_compat/spotify_playlist_cloud.py"
      - ".github/workflows/playlist-manager-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile manager
        run: python -m py_compile compat/spotify_playlist_manager.py compat/spotify_playlist_cloud.py
      - name: Run safety tests
        run: python -m unittest discover -s tests -t . -v


# -----------------------------------------------------------------------------
# FILE OVERVIEW
# Purpose: GitHub Actions workflow "Spotify playlist manager checks".
# Trigger: See the on: section above for scheduled, push, pull-request, or manual runs.
# Behavior: Automates the job steps declared in this workflow, including its
#           runtime setup, permissions, dependencies, and repository changes.
# Maintenance: Keep paths, secrets, permissions, and Python versions synchronized
#              with the implementation under scripts/ and compat/.
# Related: See docs/ for feature-specific operating instructions.
# -----------------------------------------------------------------------------
