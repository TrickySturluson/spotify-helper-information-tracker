name: Spotify playlist manager checks

on:
  push:
    branches: [spotify-playlist-manager]
    paths:
      - "compat/spotify_playlist_manager.py"
      - "compat/spotify_playlist_cloud.py"
      - "README.md"
      - ".github/workflows/spotify-playlist-manager.yml"
      - "tests/test_compat/spotify_playlist_manager.py"
      - "tests/test_compat/spotify_playlist_cloud.py"
      - ".github/workflows/playlist-manager-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile manager
        run: python -m py_compile compat/spotify_playlist_manager.py compat/spotify_playlist_cloud.py
      - name: Run safety tests
        run: python -m unittest discover -s tests -t . -v


# -----------------------------------------------------------------------------
# FILE OVERVIEW
# Purpose: Read-only compile and regression-test gate for playlist manager/cloud code.
# Trigger: Manual dispatch or pushes to the spotify-playlist-manager branch that
#          touch the manager/cloud implementation, README, tests or this workflow.
# Behavior: Compiles the compatibility manager/cloud entry points and runs full
#           unittest discovery.
# Permissions: contents:read; no Spotify credentials, provider calls or write token.
# Safety: Test-only workflow; does not call Spotify or mutate playlists/repository data.
# Related: tests/test_spotify_playlist_manager.py, tests/test_spotify_playlist_cloud.py,
#          docs/SPOTIFY_API_OPERATIONS.md, docs/WORKFLOWS.md.
# -----------------------------------------------------------------------------
