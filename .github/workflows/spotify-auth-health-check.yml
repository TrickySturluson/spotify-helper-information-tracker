name: SHIT — Spotify Auth Health Check

on:
  workflow_dispatch:
  schedule:
    # The prior run's redacted status marker prevents futile invalid_grant retries.
    - cron: "0 9 * * *"

permissions:
  contents: read
  actions: read

concurrency:
  group: spotify-auth-health-check
  cancel-in-progress: false

jobs:
  verify:
    name: Verify Spotify refresh authentication
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check durable reauthorization latch
        id: auth-latch
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ]; then
            runs="$(gh run list --workflow spotify-auth-health-check.yml --repo "$GITHUB_REPOSITORY" --limit 10 --json databaseId,status,createdAt)"
            previous_run="$(printf '%s' "$runs" | jq -r --arg current "$CURRENT_RUN_ID" '[.[] | select((.databaseId|tostring) != $current and .status == "completed")] | sort_by(.createdAt) | last | .databaseId // empty')"
            if [ -n "$previous_run" ]; then
              if ! logs="$(gh run view "$previous_run" --repo "$GITHUB_REPOSITORY" --log 2>/dev/null)"; then
                echo "::error::Could not inspect the previous auth-check result; refusing to contact Spotify."
                exit 1
              fi
              previous_status="$(printf '%s' "$logs" | grep -o 'AUTH_HEALTH_STATUS=[A-Za-z0-9_]*' | tail -n 1 | cut -d= -f2)"
              retry_marker="$(printf '%s' "$logs" | grep -o 'AUTH_HEALTH_RETRY_AFTER=[A-Za-z0-9_:-]*' | tail -n 1 | cut -d= -f2)"
              case "$previous_status" in
                healthy|provider_unavailable)
                  ;;
                rate_limited)
                  if ! [[ "$retry_marker" =~ ^[0-9]+$ ]] || [ "$(date +%s)" -lt "$retry_marker" ]; then
                    echo "AUTH_HEALTH_STATUS=rate_limited"
                    echo "skip=true" >> "$GITHUB_OUTPUT"
                    echo "Spotify auth check skipped until the recorded Retry-After deadline."
                    exit 0
                  fi
                  ;;
                *)
                  echo "AUTH_HEALTH_STATUS=${previous_status:-unknown}"
                  echo "skip=true" >> "$GITHUB_OUTPUT"
                  {
                    echo "## Spotify authentication check skipped"
                    echo
                    echo "The previous auth check ended in '${previous_status:-unknown}'. Scheduled checks are paused until a deliberate manual recovery attempt."
                  } >> "$GITHUB_STEP_SUMMARY"
                  exit 0
                  ;;
              esac
            fi
          fi
          echo "AUTH_HEALTH_STATUS=pending"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Validate required Spotify configuration
        if: steps.auth-latch.outputs.skip != 'true'
        env:
          SPOTIFY_CLIENT_ID: ${{ vars.SPOTIFY_CLIENT_ID }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: |
          test -n "$SPOTIFY_CLIENT_ID" || { echo "::error::Repository variable SPOTIFY_CLIENT_ID is missing."; exit 1; }
          test -n "$SPOTIFY_REFRESH_TOKEN" || { echo "::error::Repository secret SPOTIFY_REFRESH_TOKEN is missing."; exit 1; }
          echo "Required Spotify configuration is present."

      - name: Mint narrowly scoped GitHub App token for Spotify secret rotation
        if: steps.auth-latch.outputs.skip != 'true'
        id: spotify-secret-writer
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.SHIT_GITHUB_APP_CLIENT_ID }}
          private-key: ${{ secrets.SHIT_GITHUB_APP_PRIVATE_KEY }}
          permission-secrets: write

      - name: Refresh Spotify access and verify the current account
        if: steps.auth-latch.outputs.skip != 'true'
        id: health
        env:
          SPOTIFY_CLIENT_ID: ${{ vars.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          GH_TOKEN: ${{ steps.spotify-secret-writer.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import time
          from datetime import timezone
          from email.utils import parsedate_to_datetime
          import subprocess
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          def report(status, message, success=False, state_value=None):
              # Emit only a fixed status marker; no provider response bodies or tokens.
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                  output.write(f"status={status}\n")
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
                  summary.write(f"## Spotify authentication: {status.replace('_', ' ').title()}\n\n{message}\n")
              print(f"AUTH_HEALTH_STATUS={status}")
              if state_value:
                  retry_marker = state_value.split(":", 1)[1] if state_value.startswith("rate_limited_until:") else "unknown"
                  print(f"AUTH_HEALTH_RETRY_AFTER={retry_marker}")
              if success:
                  print(message)
                  return
              print(f"::error::{message}")
              raise SystemExit(1)

          def retry_state(header):
              try:
                  deadline = int(time.time()) + max(0, int(header))
              except (TypeError, ValueError):
                  try:
                      parsed = parsedate_to_datetime(str(header))
                      if parsed.tzinfo is None:
                          parsed = parsed.replace(tzinfo=timezone.utc)
                      deadline = int(parsed.timestamp())
                  except (TypeError, ValueError, OverflowError):
                      return "rate_limited_unknown"
              return f"rate_limited_until:{max(int(time.time()), deadline)}"

          client_id = os.environ["SPOTIFY_CLIENT_ID"].strip()
          refresh_token = os.environ["SPOTIFY_REFRESH_TOKEN"].strip()
          if not client_id or not refresh_token:
              report("configuration_error", "Spotify client ID or refresh-token secret is missing.")

          fields = {"grant_type": "refresh_token", "refresh_token": refresh_token}
          secret = os.environ.get("SPOTIFY_CLIENT_SECRET", "").strip()
          if secret:
              headers = {
                  "Authorization": "Basic " + base64.b64encode((client_id + ":" + secret).encode()).decode(),
                  "Content-Type": "application/x-www-form-urlencoded",
              }
          else:
              fields["client_id"] = client_id
              headers = {"Content-Type": "application/x-www-form-urlencoded"}

          request = urllib.request.Request(
              "https://accounts.spotify.com/api/token",
              data=urllib.parse.urlencode(fields).encode(),
              headers=headers,
          )
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  token_status = response.status
                  token_body = response.read()
          except urllib.error.HTTPError as exc:
              # Parse only the provider's stable error code. Never log the body or description.
              try:
                  detail = json.loads(exc.read(4096)).get("error")
              except (ValueError, AttributeError):
                  detail = None
              if detail == "invalid_grant":
                  report("reauthorization_required", "Spotify rejected the refresh grant (invalid_grant). The same credential will not be retried; owner-consented Spotify reauthorization is required.")
              if exc.code == 429:
                  retry_after = exc.headers.get("Retry-After", "")
                  safe_retry_after = (str(retry_after).splitlines()[0][:64] if retry_after else "unspecified")
                  report("rate_limited", f"Spotify rate-limited the auth check (HTTP 429). Retry-After: {safe_retry_after}. No retry was attempted.", state_value=retry_state(retry_after))
              if exc.code >= 500:
                  report("provider_unavailable", f"Spotify token service returned HTTP {exc.code}. Preserve the existing credential and retry only after bounded backoff.")
              if exc.code in (400, 401, 403) or detail in ("invalid_client", "unauthorized_client"):
                  report("configuration_error", f"Spotify rejected the client configuration (HTTP {exc.code}). Review app/client configuration; do not treat this as an expired user grant.")
              report("provider_error", f"Spotify token refresh failed with HTTP {exc.code}; response details were intentionally suppressed.")
          except urllib.error.URLError:
              report("provider_unavailable", "Could not reach Spotify token service. The credential was not changed.")

          if token_status != 200:
              report("provider_error", f"Spotify token service returned unexpected HTTP {token_status}.")
          try:
              token_data = json.loads(token_body)
          except (ValueError, TypeError):
              report("provider_error", "Spotify returned an unreadable token response.")
          access_token = token_data.get("access_token")
          if not access_token:
              report("provider_error", "Spotify token response did not contain an access token.")
          print(f"::add-mask::{access_token}")

          me_request = urllib.request.Request(
              "https://api.spotify.com/v1/me",
              headers={"Authorization": "Bearer " + access_token},
          )
          try:
              with urllib.request.urlopen(me_request, timeout=20) as response:
                  me_status = response.status
                  me_body = response.read()
          except urllib.error.HTTPError as exc:
              if exc.code == 429:
                  retry_after = exc.headers.get("Retry-After", "")
                  safe_retry_after = (str(retry_after).splitlines()[0][:64] if retry_after else "unspecified")
                  report("rate_limited", f"Spotify account verification was rate-limited (HTTP 429). Retry-After: {safe_retry_after}.", state_value=retry_state(retry_after))
              if exc.code >= 500:
                  report("provider_unavailable", f"Spotify account service returned HTTP {exc.code}.")
              if exc.code in (401, 403):
                  report("scope_or_identity_error", f"Spotify token exchange succeeded, but account verification returned HTTP {exc.code}. Review granted scopes and account authorization.")
              report("provider_error", f"Spotify account verification failed with HTTP {exc.code}; response details were suppressed.")
          except urllib.error.URLError:
              report("provider_unavailable", "Could not reach Spotify account service. The credential was not changed.")

          if me_status != 200:
              report("provider_error", f"Spotify account verification returned unexpected HTTP {me_status}.")
          try:
              account = json.loads(me_body)
              if not account.get("id"):
                  report("identity_error", "Spotify account verification returned no account identifier.")
          except (ValueError, TypeError):
              report("identity_error", "Spotify account verification returned an unreadable identity response.")

          rotated = token_data.get("refresh_token")
          if rotated and rotated != refresh_token:
              print(f"::add-mask::{rotated}")
              try:
                  subprocess.run(
                      ["gh", "secret", "set", "SPOTIFY_REFRESH_TOKEN",
                       "--repo", os.environ["GITHUB_REPOSITORY"]],
                      input=rotated,
                      text=True,
                      check=True,
                      stdout=subprocess.DEVNULL,
                      stderr=subprocess.PIPE,
                  )
              except subprocess.CalledProcessError:
                  report("secret_persistence_failed", "Spotify authentication succeeded, but secure refresh-token rotation persistence failed. Do not start Spotify-dependent operations.")
              report("healthy", "Spotify authentication and /v1/me verification succeeded; a rotated refresh token was securely persisted.", success=True)
              raise SystemExit(0)
          report("healthy", "Spotify authentication and /v1/me verification succeeded. No refresh-token rotation was returned; the existing secret remains valid.", success=True)
          PY

# -----------------------------------------------------------------------------
# FILE OVERVIEW
# Purpose: Scheduled and manually dispatched Spotify authentication monitor;
#          refreshes credentials, verifies /v1/me, persists token rotation, and
#          reports distinct non-secret failure classes without playlist writes.
# Trigger: workflow_dispatch only; scheduled monitoring is deferred until a durable reauthorization-required latch prevents repeated invalid_grant attempts.
# Safety: No retry loop; scheduled runs inspect the previous run's redacted status
#         marker and pause on permanent blockers or interrupted runs. 429 respects
#         Retry-After. GITHUB_TOKEN is Actions:read only; the GitHub App token is
#         scoped to Secrets:write solely for refresh-token rotation.
# Side effects: May replace SPOTIFY_REFRESH_TOKEN only after successful refresh;
#               never modifies playlists, Library data, or repository contents.
# -----------------------------------------------------------------------------
