name: SHIT — Spotify Auth Health Check

on:
  workflow_dispatch:
  schedule:
    # A durable commit-status latch prevents futile invalid_grant retries.
    - cron: "0 9 * * *"

# This immutable branch pins auth state across ordinary SHIT commits.
env:
  SPOTIFY_AUTH_STATE_REF: auth-state-anchor

permissions:
  contents: read
  statuses: write
  id-token: write

concurrency:
  group: spotify-auth-health-check
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    name: Verify Spotify refresh authentication
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check previous auth result before retry
        id: auth-latch
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          AUTH_STATE_SHA="$(gh api "repos/$GITHUB_REPOSITORY/commits/$SPOTIFY_AUTH_STATE_REF" --jq '.sha')"
          status_json="$(gh api "repos/$GITHUB_REPOSITORY/commits/$AUTH_STATE_SHA/status" --jq '.statuses | map(select(.context == "spotify-auth-health")) | sort_by(.created_at) | last // {}')"
          previous_state="$(printf '%s' "$status_json" | jq -r '.state // empty')"
          previous_description="$(printf '%s' "$status_json" | jq -r '.description // empty')"
          case "$previous_description" in
            rate_limited_until:*)
              retry_until="${previous_description#rate_limited_until:}"
              if ! [[ "$retry_until" =~ ^[0-9]+$ ]] || [ "$(date +%s)" -lt "$retry_until" ]; then
                echo "Spotify auth check skipped until the recorded Retry-After deadline, including manual attempts."
                echo "skip=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              ;;
            *)
              case "$previous_state" in
                ""|success|error)
                  ;;
                *)
                  if [ "$EVENT_NAME" = "schedule" ]; then
                    echo "Scheduled Spotify auth check skipped because the prior commit status is '$previous_description' (state: $previous_state)."
                    echo "skip=true" >> "$GITHUB_OUTPUT"
                    {
                      echo "## Spotify authentication check skipped"
                      echo
                      echo "The previous auth state is '$previous_description'. Scheduled checks are paused until a deliberate manual recovery attempt."
                    } >> "$GITHUB_STEP_SUMMARY"
                    exit 0
                  fi
                  echo "Manual recovery attempt explicitly bypasses previous auth state '$previous_description'."
                  ;;
              esac
              ;;
          esac
          # Mark the current commit pending before contacting Spotify. If the
          # runner exits unexpectedly, the next scheduled run fails closed.
          if ! gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$AUTH_STATE_SHA"             -f state=pending             -f context=spotify-auth-health             -f description=pending             -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null; then
            echo "::error::Could not persist the pending auth status; refusing to contact Spotify."
            exit 1
          fi
          echo "state_sha=$AUTH_STATE_SHA" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Check out SHIT source
        if: steps.auth-latch.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: Verify Spotify through the central authentication broker
        if: steps.auth-latch.outputs.skip != 'true'
        env:
          SHIT_AUTH_BROKER_URL: ${{ vars.BROKER_BASE_URL }}
          GH_TOKEN: ${{ github.token }}
          GH_STATUS_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          AUTH_STATE_COMMIT: ${{ steps.auth-latch.outputs.state_sha }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import sys
          import time
          import urllib.error
          import urllib.request
          from email.utils import parsedate_to_datetime
          from datetime import timezone

          from scripts.spotify.broker_access_token import BrokerTokenError, request_broker_access_token

          def report(status, message, success=False, state_value=None):
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
                  summary.write(f"## Spotify authentication: {status.replace('_', ' ').title()}\n\n{message}\n")
                  if status == "reauthorization_required":
                      broker = os.environ.get("SHIT_AUTH_BROKER_URL", "").strip().rstrip("/")
                      if broker.startswith("https://") and "/" not in broker[len("https://"):]:
                          summary.write(f"\n**Owner action:** [Open SHIT Spotify authorization]({broker}/) and complete the owner-consented flow.\n")
              commit_state = "success" if success else ("error" if status in ("broker_unavailable", "provider_unavailable") else "failure")
              description = state_value or status
              try:
                  subprocess.run(
                      ["gh", "api", "-X", "POST",
                       f"repos/{os.environ['GITHUB_REPOSITORY']}/statuses/{os.environ['AUTH_STATE_COMMIT']}",
                       "-f", f"state={commit_state}",
                       "-f", "context=spotify-auth-health",
                       "-f", f"description={description}",
                       "-f", f"target_url={os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"],
                      check=True, stdout=subprocess.DEVNULL, stderr=subprocess.PIPE,
                      env={**os.environ, "GH_TOKEN": os.environ["GH_STATUS_TOKEN"]},
                  )
              except subprocess.CalledProcessError:
                  print("::error::Could not persist the authentication result; the pending latch will pause scheduled checks.")
                  raise SystemExit(1) from None
              if success:
                  print(message)
              else:
                  print(f"::error::{message}")
                  raise SystemExit(1)

          def retry_state(header):
              try:
                  deadline = int(time.time()) + max(0, int(header))
              except (TypeError, ValueError):
                  try:
                      parsed = parsedate_to_datetime(str(header))
                      if parsed.tzinfo is None:
                          parsed = parsed.replace(tzinfo=timezone.utc)
                      deadline = int(parsed.timestamp())
                  except (TypeError, ValueError, OverflowError):
                      deadline = int(time.time()) + 86400
              return f"rate_limited_until:{max(int(time.time()), deadline)}"

          try:
              access_token, _expires_in = request_broker_access_token()
          except BrokerTokenError as exc:
              if exc.category == "reauthorization_required":
                  report("reauthorization_required", "The central broker reports that fresh owner-consented Spotify authorization is required.")
              if exc.category == "rate_limited":
                  report("rate_limited", "Spotify authentication is rate-limited. The central broker retained the credential and no retry was attempted.", state_value=retry_state(None))
              report("broker_unavailable", "The central authentication broker could not complete the request. No legacy refresh-token fallback was attempted.")

          print("::add-mask::" + access_token)
          request = urllib.request.Request(
              "https://api.spotify.com/v1/me",
              headers={"Authorization": "Bearer " + access_token, "Accept": "application/json"},
          )
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  profile = json.loads(response.read(65536))
          except urllib.error.HTTPError as exc:
              if exc.code == 429:
                  report("rate_limited", "Spotify account verification was rate-limited; no retry was attempted.", state_value=retry_state(exc.headers.get("Retry-After")))
              if exc.code >= 500:
                  report("provider_unavailable", f"Spotify account verification returned HTTP {exc.code}.")
              report("identity_error", f"Spotify account verification failed with HTTP {exc.code}.")
          except (urllib.error.URLError, TimeoutError):
              report("provider_unavailable", "Could not reach Spotify account verification. The central credential was not changed.")

          if not isinstance(profile, dict) or not isinstance(profile.get("id"), str) or not profile["id"]:
              report("identity_error", "Spotify account verification returned no usable account identity.")
          report("healthy", "The central broker issued a short-lived access token and Spotify /v1/me verification succeeded.", success=True)
          PY

# -----------------------------------------------------------------------------
# FILE OVERVIEW
# Purpose: Scheduled and manually dispatched Spotify authentication monitor;
#          refreshes credentials, verifies /v1/me, persists token rotation, and
#          reports distinct non-secret failure classes without playlist writes.
# Trigger: Daily schedule (09:00 UTC) and workflow_dispatch. Scheduled runs
#          inspect the prior commit's redacted auth status before retrying.
# Safety: No retry loop; scheduled runs inspect the prior commit status and pause
#         on permanent blockers or interrupted runs. 429 respects Retry-After.
#         GITHUB_TOKEN is limited to commit-status write; the GitHub App token is
#         scoped to Secrets:write solely for refresh-token rotation.
# Side effects: May replace SPOTIFY_REFRESH_TOKEN only after successful refresh;
#               never modifies playlists, Library data, or repository contents.
# -----------------------------------------------------------------------------
