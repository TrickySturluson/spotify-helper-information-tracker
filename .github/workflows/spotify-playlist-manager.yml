name: SHIT — Spotify Helper & Information Tracker

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  actions: read

concurrency:
  group: spotify-playlist-control
  cancel-in-progress: false

jobs:
  control:
    if: >-
      github.event.issue.title == 'SHIT — Playlist Control' &&
      github.event.issue.state == 'open' &&
      github.event.sender.login == 'TrickySturluson'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install no third-party dependencies
        run: |
          python -m py_compile compat/spotify_playlist_manager.py compat/spotify_playlist_cloud.py compat/spotify_discovery.py compat/playlist_intelligence.py compat/playlist_metadata.py compat/mood_inference.py
          python -m unittest discover -s tests -t . -v
      - name: Read command type
        id: parse-command
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
          command = json.loads(event["issue"].get("body") or "{}")
          state = json.loads(Path(".github/spotify_playlist_manager_state.json").read_text())
          pending_kind = (state.get("pending") or {}).get("kind", "edit")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("command=" + str(command.get("command", "")) + "\n")
              output.write("pending_kind=" + str(pending_kind) + "\n")
          PY
      - name: Download prior recovery snapshot for undo
        if: >-
          steps.parse-command.outputs.command == 'undo' ||
          (steps.parse-command.outputs.command == 'confirm' &&
          steps.parse-command.outputs.pending_kind == 'undo')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BACKUP_RUN_ID=$(python -c 'import json; print(json.load(open(".github/spotify_playlist_manager_state.json")).get("last_completed", {}).get("backup_run_id", ""))')
          if [ -z "$BACKUP_RUN_ID" ]; then
            echo "No previous backup workflow run is recorded." >&2
            exit 1
          fi
          gh run download "$BACKUP_RUN_ID" --name "spotify-playlist-backups-$BACKUP_RUN_ID" --dir playlist_backups --repo "${{ github.repository }}"
      - name: Execute owner command
        id: command
        env:
          SPOTIFY_CLIENT_ID: ${{ vars.SPOTIFY_CLIENT_ID }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: python compat/spotify_playlist_cloud.py
      - name: Preserve pre-change snapshot
        if: always() && hashFiles('playlist_backups/**') != ''
        uses: actions/upload-artifact@v7.0.2
        with:
          name: spotify-playlist-backups-${{ github.run_id }}
          path: playlist_backups/
          retention-days: 30
          if-no-files-found: ignore
      - name: Persist lock state and audit
        if: always() && steps.command.outcome != 'skipped'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f .github/spotify_playlist_manager_state.json ]; then git add .github/spotify_playlist_manager_state.json; fi
          if [ -f .github/spotify_playlist_manager_audit.jsonl ]; then git add .github/spotify_playlist_manager_audit.jsonl; fi
          if [ -f .github/spotify_api_cooldown.json ]; then git add .github/spotify_api_cooldown.json; fi
          if [ -f assistant_data/music/artist_profiles.json ]; then git add assistant_data/music/artist_profiles.json; fi
          if [ -f assistant_data/spotify/daily_feedback.json ]; then git add assistant_data/spotify/daily_feedback.json; fi
          if [ -f assistant_data/recommendations/discovery_candidates.json ]; then git add assistant_data/recommendations/discovery_candidates.json; fi
          if ! git diff --cached --quiet; then
            git commit -m "Update Spotify playlist manager state"
            published=false
            for attempt in 1 2 3 4 5; do
              echo "Safe state publication attempt $attempt/5"
              git fetch origin main
              if ! git rebase origin/main; then
                echo "Rebase conflict; aborting without overwriting concurrent repository changes."
                git rebase --abort || true
                exit 1
              fi
              if git push origin HEAD:main; then
                published=true
                echo "Playlist manager state published on attempt $attempt."
                break
              fi
              echo "Push raced with another main update; retrying after fetch/rebase."
              if [ "$attempt" -lt 5 ]; then sleep 2; fi
            done
            if [ "$published" != "true" ]; then
              echo "Could not safely publish playlist manager state after five attempts."
              exit 1
            fi
          fi
      - name: Report result
        if: steps.command.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ steps.command.outputs.result }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue comment "$ISSUE_NUMBER" --body "$RESULT"


