# Behavior: Automates the job steps declared in this workflow, including runtime
#           setup, permissions, dependencies, and repository changes.
# Maintenance: Keep paths, secrets, permissions, and Python versions synchronized
#              with the implementation under scripts/ and compat/.
# Related: See docs/ for feature-specific operating instructions.
