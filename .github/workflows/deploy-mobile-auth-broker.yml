name: Deploy SHIT Auth Broker

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shit-auth-broker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.actor == 'TrickySturluson'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install pinned broker dependencies
        working-directory: auth-broker
        run: npm ci --ignore-scripts
      - name: Validate deployment configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          BROKER_BASE_URL: ${{ vars.BROKER_BASE_URL }}
          BROKER_GH_APP_CLIENT_ID: ${{ vars.BROKER_GH_APP_CLIENT_ID }}
          BROKER_GH_APP_ID: ${{ vars.BROKER_GH_APP_ID }}
          BROKER_GH_APP_REDIRECT_URI: ${{ vars.BROKER_GH_APP_REDIRECT_URI }}
          SPOTIFY_CLIENT_ID: ${{ vars.SPOTIFY_CLIENT_ID }}
          SPOTIFY_REDIRECT_URI: ${{ vars.SPOTIFY_REDIRECT_URI }}
          SPOTIFY_CREDENTIAL_ACTIVE_KEY_VERSION: ${{ vars.SPOTIFY_CREDENTIAL_ACTIVE_KEY_VERSION }}
          SPOTIFY_REFRESH_WORKFLOW_REFS: ${{ vars.SPOTIFY_REFRESH_WORKFLOW_REFS }}
        run: |
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID BROKER_BASE_URL BROKER_GH_APP_CLIENT_ID BROKER_GH_APP_ID BROKER_GH_APP_REDIRECT_URI SPOTIFY_CLIENT_ID SPOTIFY_REDIRECT_URI SPOTIFY_CREDENTIAL_ACTIVE_KEY_VERSION SPOTIFY_REFRESH_WORKFLOW_REFS; do
            if [ -z "${!name}" ]; then
              echo "::error::Required deployment setting $name is missing."
              exit 1
            fi
          done
          case "$BROKER_BASE_URL" in
            https://*/*) echo "::error::BROKER_BASE_URL must be an HTTPS origin with no path or trailing slash."; exit 1 ;;
            https://*) ;;
            *) echo "::error::BROKER_BASE_URL must use HTTPS."; exit 1 ;;
          esac
          case "$BROKER_GH_APP_REDIRECT_URI" in
            "$BROKER_BASE_URL"/auth/github/callback) ;;
            *) echo "::error::GitHub callback URI must match BROKER_BASE_URL."; exit 1 ;;
          esac
          case "$SPOTIFY_REDIRECT_URI" in
            "$BROKER_BASE_URL"/spotify/callback) ;;
            *) echo "::error::Spotify callback URI must match BROKER_BASE_URL."; exit 1 ;;
          esac
          case "$SPOTIFY_CREDENTIAL_ACTIVE_KEY_VERSION" in
            [1-9]|[1-9][0-9]|[1-9][0-9][0-9]|[1-9][0-9][0-9][0-9]) ;;
            *) echo "::error::SPOTIFY_CREDENTIAL_ACTIVE_KEY_VERSION must be a positive integer."; exit 1 ;;
          esac
          expected_workflow_refs="$GITHUB_REPOSITORY/.github/workflows/spotify-auth-health-check.yml@refs/heads/main,$GITHUB_REPOSITORY/.github/workflows/spotify-daily-live-preflight.yml@refs/heads/main,$GITHUB_REPOSITORY/.github/workflows/spotify-daily-midnight-cycle.yml@refs/heads/main,$GITHUB_REPOSITORY/.github/workflows/spotify-daily-feedback-observation.yml@refs/heads/main,$GITHUB_REPOSITORY/.github/workflows/tricky-daily-snapshot-refresh.yml@refs/heads/main,$GITHUB_REPOSITORY/.github/workflows/spotify-reference-library.yml@refs/heads/main,$GITHUB_REPOSITORY/.github/workflows/spotify-playlist-manager.yml@refs/heads/main,$GITHUB_REPOSITORY/.github/workflows/great-migration.yml@refs/heads/main,$GITHUB_REPOSITORY/.github/workflows/update.yml@refs/heads/main"
          if [ "$SPOTIFY_REFRESH_WORKFLOW_REFS" != "$expected_workflow_refs" ]; then
            echo "::error::The broker allowlist must exactly match the nine migrated main-branch Spotify workflow refs; wildcards and additional workflows are forbidden."
            exit 1
          fi
      - name: Deploy Worker
        working-directory: auth-broker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          BROKER_BASE_URL: ${{ vars.BROKER_BASE_URL }}
          BROKER_GH_APP_CLIENT_ID: ${{ vars.BROKER_GH_APP_CLIENT_ID }}
          BROKER_GH_APP_ID: ${{ vars.BROKER_GH_APP_ID }}
          BROKER_GH_APP_REDIRECT_URI: ${{ vars.BROKER_GH_APP_REDIRECT_URI }}
          SPOTIFY_CLIENT_ID: ${{ vars.SPOTIFY_CLIENT_ID }}
          SPOTIFY_REDIRECT_URI: ${{ vars.SPOTIFY_REDIRECT_URI }}
          SPOTIFY_CREDENTIAL_ACTIVE_KEY_VERSION: ${{ vars.SPOTIFY_CREDENTIAL_ACTIVE_KEY_VERSION }}
          SPOTIFY_REFRESH_WORKFLOW_REFS: ${{ vars.SPOTIFY_REFRESH_WORKFLOW_REFS }}
        run: |
          npx wrangler deploy \
            --var "BROKER_BASE_URL:$BROKER_BASE_URL" \
            --var "GITHUB_APP_CLIENT_ID:$BROKER_GH_APP_CLIENT_ID" \
            --var "GITHUB_APP_ID:$BROKER_GH_APP_ID" \
            --var "GITHUB_APP_REDIRECT_URI:$BROKER_GH_APP_REDIRECT_URI" \
            --var "SPOTIFY_CLIENT_ID:$SPOTIFY_CLIENT_ID" \
            --var "SPOTIFY_REDIRECT_URI:$SPOTIFY_REDIRECT_URI" \\
            --var "SPOTIFY_CREDENTIAL_ACTIVE_KEY_VERSION:$SPOTIFY_CREDENTIAL_ACTIVE_KEY_VERSION" \\
            --var "SPOTIFY_REFRESH_WORKFLOW_REFS:$SPOTIFY_REFRESH_WORKFLOW_REFS"

# FILE OVERVIEW
# Purpose: Deploy the SHIT-wide Spotify OAuth broker to the configured Cloudflare Worker.
# Trigger: Owner-only manual workflow_dispatch on main.
# Credentials: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID; public runtime IDs/URLs come from repository variables.
# Side effects: Publishes the Worker source/configuration to the configured Cloudflare account.
# Safety: Does not contact Spotify, write GitHub repository secrets, or modify playlists.
