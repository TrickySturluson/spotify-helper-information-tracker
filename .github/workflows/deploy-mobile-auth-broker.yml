name: Deploy SHIT Auth Broker

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shit-auth-broker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.actor == 'TrickySturluson'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install pinned broker dependencies
        working-directory: auth-broker
        run: npm ci --ignore-scripts
      - name: Validate deployment configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          BROKER_BASE_URL: ${{ vars.BROKER_BASE_URL }}
          GITHUB_APP_CLIENT_ID: ${{ vars.GITHUB_APP_CLIENT_ID }}
          GITHUB_APP_ID: ${{ vars.GITHUB_APP_ID }}
          GITHUB_APP_REDIRECT_URI: ${{ vars.GITHUB_APP_REDIRECT_URI }}
          SPOTIFY_CLIENT_ID: ${{ vars.SPOTIFY_CLIENT_ID }}
          SPOTIFY_REDIRECT_URI: ${{ vars.SPOTIFY_REDIRECT_URI }}
        run: |
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID BROKER_BASE_URL GITHUB_APP_CLIENT_ID GITHUB_APP_ID GITHUB_APP_REDIRECT_URI SPOTIFY_CLIENT_ID SPOTIFY_REDIRECT_URI; do
            if [ -z "${!name}" ]; then
              echo "::error::Required deployment setting $name is missing."
              exit 1
            fi
          done
          case "$BROKER_BASE_URL" in
            https://*/*) echo "::error::BROKER_BASE_URL must be an HTTPS origin with no path or trailing slash."; exit 1 ;;
            https://*) ;;
            *) echo "::error::BROKER_BASE_URL must use HTTPS."; exit 1 ;;
          esac
          case "$GITHUB_APP_REDIRECT_URI" in
            "$BROKER_BASE_URL"/auth/github/callback) ;;
            *) echo "::error::GitHub callback URI must match BROKER_BASE_URL."; exit 1 ;;
          esac
          case "$SPOTIFY_REDIRECT_URI" in
            "$BROKER_BASE_URL"/spotify/callback) ;;
            *) echo "::error::Spotify callback URI must match BROKER_BASE_URL."; exit 1 ;;
          esac
      - name: Deploy Worker
        working-directory: auth-broker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          BROKER_BASE_URL: ${{ vars.BROKER_BASE_URL }}
          GITHUB_APP_CLIENT_ID: ${{ vars.GITHUB_APP_CLIENT_ID }}
          GITHUB_APP_ID: ${{ vars.GITHUB_APP_ID }}
          GITHUB_APP_REDIRECT_URI: ${{ vars.GITHUB_APP_REDIRECT_URI }}
          SPOTIFY_CLIENT_ID: ${{ vars.SPOTIFY_CLIENT_ID }}
          SPOTIFY_REDIRECT_URI: ${{ vars.SPOTIFY_REDIRECT_URI }}
        run: |
          npx wrangler deploy \
            --var "BROKER_BASE_URL:$BROKER_BASE_URL" \
            --var "GITHUB_APP_CLIENT_ID:$GITHUB_APP_CLIENT_ID" \
            --var "GITHUB_APP_ID:$GITHUB_APP_ID" \
            --var "GITHUB_APP_REDIRECT_URI:$GITHUB_APP_REDIRECT_URI" \
            --var "SPOTIFY_CLIENT_ID:$SPOTIFY_CLIENT_ID" \
            --var "SPOTIFY_REDIRECT_URI:$SPOTIFY_REDIRECT_URI"

# FILE OVERVIEW
# Purpose: Deploy the phone-first Spotify OAuth broker to the configured Cloudflare Worker.
# Trigger: Owner-only manual workflow_dispatch on main.
# Credentials: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID; public runtime IDs/URLs come from repository variables.
# Side effects: Publishes the Worker source/configuration to the configured Cloudflare account.
# Safety: Does not contact Spotify, write GitHub repository secrets, or modify playlists.
