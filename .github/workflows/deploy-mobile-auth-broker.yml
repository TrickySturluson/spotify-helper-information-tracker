name: Deploy SHIT Mobile Auth Broker

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shit-mobile-auth-broker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.actor == 'TrickySturluson'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install pinned broker dependencies
        working-directory: auth-broker
        run: npm install --ignore-scripts
      - name: Deploy Worker
        working-directory: auth-broker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN secret is missing."; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::CLOUDFLARE_ACCOUNT_ID variable is missing."; exit 1; }
          npx wrangler deploy

# FILE OVERVIEW
# Purpose: Deploy the phone-first Spotify OAuth broker to the configured Cloudflare Worker.
# Trigger: Owner-only manual workflow_dispatch on main.
# Credentials: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID; no Spotify or GitHub App secrets are read by this workflow.
# Side effects: Publishes the Worker source/configuration to the configured Cloudflare account.
# Safety: Does not contact Spotify, write GitHub repository secrets, or modify playlists.
