name: Enrich Music Metadata

on:
  # Small daily batches keep metadata coverage moving without a large backfill.
  # UTC 08:17; manual dispatch remains available for larger runs.
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:
    inputs:
      musicbrainz_lookups:
        description: "Maximum MusicBrainz duration lookups"
        required: true
        type: choice
        options:
          - "1000"
          - "3000"
          - "6000"
        default: "3000"
      artist_profile_lookups:
        description: "Maximum artist genre/theme profile lookups"
        required: true
        type: choice
        options:
          - "120"
          - "500"
          - "1000"
        default: "500"
      track_profile_lookups:
        description: "Maximum track-level tag lookups"
        required: true
        type: choice
        options:
          - "120"
          - "300"
          - "600"
        default: "300"

permissions:
  contents: write

concurrency:
  group: music-metadata-enrichment
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests before enrichment
        run: python -m unittest discover -s tests -t . -v
      - name: Fill missing durations from MusicBrainz
        env:
          MUSICBRAINZ_LOOKUPS_PER_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.musicbrainz_lookups || '300' }}
        run: python compat/enrich_musicbrainz_durations.py
      - name: Enrich artist genres, moods and themes
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          MUSIC_PROFILE_LOOKUPS_PER_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.artist_profile_lookups || '100' }}
        run: python compat/build_music_profiles.py
      - name: Enrich individual track tags from Last.fm and MusicBrainz
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          TRACK_PROFILE_LOOKUPS_PER_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.track_profile_lookups || '120' }}
          TRACK_PROFILE_PRIORITY_PLAYLISTS: "4diIlnF8BlgoJrwUfejf49"
        run: python compat/build_track_profiles.py
      - name: Rebuild metadata summaries
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          MUSIC_METADATA_LOOKUPS_PER_RUN: "0"
        run: python compat/build_music_metadata.py
      - name: Refresh main assistant summary
        run: python compat/build_assistant_data.py
      - name: Build music duration trends and recommendation features
        run: python compat/build_music_analytics.py
      - name: Publish complete-history and verified listening-time estimates
        run: python compat/build_listening_time_summary.py
      - name: Validate generated music metadata
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          overview = json.loads(Path("assistant_data/music/overview.json").read_text(encoding="utf-8"))
          manifest = json.loads(Path("assistant_data/music/manifest.json").read_text(encoding="utf-8"))
          assert overview["total_scrobbles"] == manifest["source_scrobbles"]
          assert overview["unique_tracks"] == manifest["unique_tracks"]
          assert overview["tracks_with_duration"] <= overview["unique_tracks"]
          profiles = json.loads(Path("assistant_data/music/artist_profiles.json").read_text(encoding="utf-8"))
          track_profiles = json.loads(Path("assistant_data/music/track_profiles.json").read_text(encoding="utf-8"))
          assert len(track_profiles) <= overview["unique_tracks"]
          tagged_tracks = sum(1 for p in track_profiles.values() if p.get("lastfm_tags") or p.get("musicbrainz_tags") or p.get("musicbrainz_genres"))
          print(f"Duration coverage: {overview['tracks_with_duration']:,}/{overview['unique_tracks']:,} tracks; artist profiles: {sum(1 for p in profiles.values() if p.get('status') == 'matched'):,}; track profiles: {tagged_tracks:,}")
          PY
      - name: Run umbrella project integrity audit
        run: python compat/audit_project.py
      - name: Commit enriched music data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assistant_data/ data/stats.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Enrich music durations and artist profiles"
            git push
          fi


# -----------------------------------------------------------------------------
