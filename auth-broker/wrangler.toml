name = "shit-auth-broker"
main = "src/index.js"
compatibility_date = "2026-11-08"
preview_urls = true

# Cloudflare Workers Builds invokes `wrangler preview` for pull-request previews.
# This empty block enables that preview command without changing production behavior.
# Previews use isolated Durable Object namespaces and a separate rate-limit namespace.
[[previews.durable_objects.bindings]]
name = "OAUTH_STATE"
class_name = "OAuthStateStore"

[[previews.durable_objects.bindings]]
name = "SPOTIFY_REFRESH_LEASE"
class_name = "SpotifyRefreshLease"

[[previews.ratelimits]]
name = "AUTH_RATE_LIMITER"
namespace_id = "20261109"
simple = { limit = 20, period = 60 }

# Public runtime variables are injected from GitHub Actions repository variables
# by deploy-mobile-auth-broker.yml using Wrangler's --var flags.
# SQLite-backed Durable Objects provide strongly consistent, transactional state.
[[durable_objects.bindings]]
name = "OAUTH_STATE"
class_name = "OAuthStateStore"

[[durable_objects.bindings]]
name = "SPOTIFY_REFRESH_LEASE"
class_name = "SpotifyRefreshLease"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["OAuthStateStore"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["SpotifyRefreshLease"]

# Cloudflare's edge rate limiter protects each OAuth entry/callback route.
[[ratelimits]]
name = "AUTH_RATE_LIMITER"
namespace_id = "20261108"
simple = { limit = 20, period = 60 }

[observability]
enabled = false
