name = "shit-mobile-auth-broker"
main = "src/index.js"
compatibility_date = "2026-11-08"

# Public runtime variables are injected from GitHub Actions repository variables
# by deploy-mobile-auth-broker.yml using Wrangler's --var flags.
# SQLite-backed Durable Object provides strongly consistent, transactional OAuth state.
[[durable_objects.bindings]]
name = "OAUTH_STATE"
class_name = "OAuthStateStore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["OAuthStateStore"]

# Cloudflare's edge rate limiter protects each OAuth entry/callback route.
[[ratelimits]]
name = "AUTH_RATE_LIMITER"
namespace_id = "20261108"
simple = { limit = 20, period = 60 }

[observability]
enabled = false
