title = "SHIT public music-library identifier allowlist"

[extend]
useDefault = true

[allowlist]
description = "Public catalog identifiers in the generated music-library index only."
paths = ['''assistant_data/music/library/library_index\.json''']

[[allowlists]]
description = "Exact historical auth-state commit-reference false positives in two audited source locations."
condition = "AND"
regexTarget = "line"
regexes = [
  '''SPOTIFY_AUTH_STATE_SHA: \$\{\{ steps\.auth-latch\.outputs\.state_sha \}\}''',
  '''SPOTIFY_AUTH_STATE_SHA: ''',
]
paths = [
  '''^\.github/workflows/spotify-auth-health-check\.yml$''',
  '''^tests/test_spotify_auth_health_workflow\.py$''',
]
