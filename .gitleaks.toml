title = "SHIT public music-library identifier allowlist"

[extend]
useDefault = true

[allowlist]
description = "Exact known false positives only: public catalog identifiers and a public Git commit SHA used as an auth-state anchor. Fingerprints constrain exceptions to the original file, commit, rule, and line."
regexes = [
  '''SPOTIFY_AUTH_STATE_SHA: [a-f0-9]{40}''',
]
paths = ['''assistant_data/music/library/library_index\.json''']
